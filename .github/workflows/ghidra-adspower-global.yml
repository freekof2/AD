name: Ghidra Adspower-Global 全量反编译

on:
  workflow_dispatch:
    inputs:
      full_decompile:
        description: '是否全量反编译(默认true,很慢很大)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      sample_url:
        description: '样本下载地址'
        required: false
        default: 'https://github.com/freekof2/AD/releases/download/1.0.0.1/AdsPower.Global.exe'
      sample_sha256:
        description: '样本SHA256'
        required: false
        default: 'c9ac99bb20ef2121a4e1c4331af249c4db4edd81b7482a2e3a04c7ee59d309cb'

  push:
    paths:
      - ".github/workflows/ghidra-adspower-global.yml"

permissions:
  contents: read

env:
  GHIDRA_URL: "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip"
  TARGET_URL: "https://github.com/freekof2/AD/releases/download/1.0.0.1/AdsPower.Global.exe"
  TARGET_NAME: "AdsPower.Global.exe"
  TARGET_SHA256: "c9ac99bb20ef2121a4e1c4331af249c4db4edd81b7482a2e3a04c7ee59d309cb"

jobs:
  ghidra-analyze:
    name: Ghidra 全量反编译 AdsPower.Global
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Java (Ghidra 需要 JDK 21+)
      # ------------------------------------------------------------
      - name: Setup Java for Ghidra
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ------------------------------------------------------------
      # 3. 目录准备
      # ------------------------------------------------------------
      - name: Prepare dirs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "analysis/downloads" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis/reports" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis/ghidra/proj" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis/ghidra/out" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis/resources" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis/asar" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis/strings" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis/dotnet" | Out-Null

      # ------------------------------------------------------------
      # 4. 下载 Ghidra（官方 zip，只解压不执行样本）
      # ------------------------------------------------------------
      - name: Download Ghidra
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "$env:RUNNER_TEMP/ghidra.zip"
          Write-Host "Downloading Ghidra from: ${env:GHIDRA_URL}"
          try {
            Invoke-WebRequest -Uri $env:GHIDRA_URL -OutFile $zip -UseBasicParsing
          } catch {
            Write-Warning "Ghidra 12.1.3 下载失败，切换到稳定版 11.3.2"
            $fallback = "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.3.2_build/ghidra_11.3.2_PUBLIC_20250415.zip"
            Invoke-WebRequest -Uri $fallback -OutFile $zip -UseBasicParsing
          }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP/ghidra" -Force
          $dir = Get-ChildItem "$env:RUNNER_TEMP/ghidra" -Directory | Select-Object -First 1
          "GHIDRA_DIR=$($dir.FullName)" >> $env:GITHUB_ENV
          Write-Host "GHIDRA_DIR=$($dir.FullName)"
          Get-ChildItem (Join-Path $dir.FullName "support/analyzeHeadless.bat") -ErrorAction Stop
          java -version

      # ------------------------------------------------------------
      # 5. 下载 + SHA256 校验 AdsPower.Global.exe（只读，不执行）
      # ------------------------------------------------------------
      - name: Download and verify sample
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "${{ inputs.sample_url }}"
          if ([string]::IsNullOrWhiteSpace($url)) { $url = "${env:TARGET_URL}" }
          $exp = "${{ inputs.sample_sha256 }}"
          if ([string]::IsNullOrWhiteSpace($exp)) { $exp = "${env:TARGET_SHA256}" }
          $exp = $exp.ToLower()
          $out = "analysis/downloads/${env:TARGET_NAME}"
          Write-Host "URL: $url"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          $f = Get-Item $out
          Write-Host "Size: $($f.Length) bytes"
          $h = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          Write-Host "actual  : $h"
          Write-Host "expected: $exp"
          if ($h -ne $exp) { throw "SHA256 mismatch，拒绝分析" }
          Write-Host "SHA256 OK"

      # ------------------------------------------------------------
      # 6. PE 分层 triage（头/CLR/字符串/可疑导入，全静态）
      #    重点找 SunBrowser 启动痕迹
      # ------------------------------------------------------------
      - name: PE triage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path "analysis/downloads/${env:TARGET_NAME}"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $r = @()
          $r += "=== AdsPower.Global PE triage ==="
          $r += "File: $exe"
          $r += "Size: $($bytes.Length) bytes"
          $r += ""
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            $r += "判定: 不是有效 MZ PE，直接看 Ghidra 日志"
            $r | Out-File "analysis/reports/pe-triage.txt" -Encoding utf8
            Get-Content "analysis/reports/pe-triage.txt"
            exit 0
          }
          $peOff = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $r += ("e_lfanew: 0x{0:X8}" -f $peOff)
          $sig = [System.Text.Encoding]::ASCII.GetString($bytes, $peOff, 4)
          $r += "PE sig: $sig"
          $magic = [System.BitConverter]::ToUInt16($bytes, $peOff + 24)
          $r += ("OptionalMagic: 0x{0:X4} (0x10B=x86, 0x20B=x64)" -f $magic)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOff + 4)
          $r += ("Machine: 0x{0:X4}" -f $machine)
          # CLR 目录: DataDirectory[14]
          if ($magic -eq 0x10B) { $dd = $peOff + 24 + 96 } else { $dd = $peOff + 24 + 112 }
          $clrRva = [System.BitConverter]::ToUInt32($bytes, $dd + 14 * 8)
          $clrSz  = [System.BitConverter]::ToUInt32($bytes, $dd + 14 * 8 + 4)
          $r += ("CLR RVA: 0x{0:X8} Size: {1}" -f $clrRva, $clrSz)
          if ($clrRva -ne 0 -and $clrSz -ne 0) {
            $r += "判定: 疑似 .NET，Ghidra 效果差，应看 ilspycmd 输出"
          } else {
            $r += "判定: 非托管 PE，Ghidra 适用；若含 app.asar/Electron 则重点看 asar+JS"
          }
          $r += ""
          $r += "--- 可疑字符串计数(静态，SunBrowser启动链) ---"
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($p in @('SunBrowser','sunbrowser','chrome_152','user-data-dir','remote-debugging','chrome_proxy','chromedriver','CreateProcess','ShellExecute','LoadLibrary','app.asar','Electron','IsDebuggerPresent','ExitProcess','UPX!','Themida','VMProtect','.NET')) {
            $c = ([regex]::Matches($ascii, [regex]::Escape($p), 'IgnoreCase')).Count
            $r += "$p : $c"
          }
          $r += ""
          $r += "解读: SunBrowser/user-data-dir/remote-debugging>0 说明含启动命令行模板；CreateProcess/ShellExecute>0 说明是启动器；UPX!/Themida>0 说明加壳，入口反编译会失真；app.asar/Electron>0 说明真逻辑在 asar 的 JS 里，Ghidra 只能看到壳。"
          $r | Out-File "analysis/reports/pe-triage.txt" -Encoding utf8
          Get-Content "analysis/reports/pe-triage.txt"

      # ------------------------------------------------------------
      # 7. 字符串提取（ASCII + UTF-16LE，全静态）
      # ------------------------------------------------------------
      - name: Extract strings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "analysis/downloads/${env:TARGET_NAME}"
          $bytes = [System.IO.File]::ReadAllBytes($file)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          [regex]::Matches($ascii, '[ -~]{6,}') |
            ForEach-Object { $_.Value } |
            Sort-Object -Unique |
            Out-File "analysis/strings/ascii.txt" -Encoding utf8
          $unicode = [System.Text.Encoding]::Unicode.GetString($bytes)
          [regex]::Matches($unicode, '[\u0020-\uFFFF]{4,}') |
            ForEach-Object { $_.Value } |
            Sort-Object -Unique |
            Out-File "analysis/strings/unicode.txt" -Encoding utf8
          Write-Host "ASCII strings:"
          (Get-Content "analysis/strings/ascii.txt").Count
          Write-Host "Unicode strings:"
          (Get-Content "analysis/strings/unicode.txt").Count
          # SunBrowser 快速命中（只列命中行，不证明运行时行为）
          $pats = @('SunBrowser','user-data-dir','remote-debugging','chrome_152','profile-directory','no-first-run','about:blank')
          $hits = @()
          foreach ($p in $pats) {
            $m = Select-String -Path "analysis/strings/ascii.txt","analysis/strings/unicode.txt" -Pattern $p -SimpleMatch -CaseSensitive:$false -ErrorAction SilentlyContinue
            foreach ($x in $m) { $hits += "[$p] $($x.Line)" }
          }
          $hits | Sort-Object -Unique | Out-File "analysis/reports/string-hits-sunbrowser.txt" -Encoding utf8
          Write-Host "SunBrowser string hits: $($hits.Count)"

      # ------------------------------------------------------------
      # 8. 7z 只读解包 + asar 提取 + JS 静态检索 SunBrowser 启动方法
      #    （不执行任何 JS/DLL/EXE）
      # ------------------------------------------------------------
      - name: Install 7-Zip if missing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Command 7z.exe -ErrorAction SilentlyContinue) { Write-Host "7-Zip already installed."; exit 0 }
          choco install 7zip -y --no-progress
          if (!(Get-Command 7z.exe -ErrorAction SilentlyContinue)) { throw "7-Zip installation failed." }

      - name: Extract embedded archive data
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $exe = Resolve-Path "analysis/downloads/${env:TARGET_NAME}"
          $out = Resolve-Path "analysis/resources"
          7z x "$exe" "-o$out" "-y" > "analysis/reports/7zip-extraction.log" 2>&1
          Write-Host "7-Zip extraction done."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Extract ASAR and grep SunBrowser launch
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          npm install --global @electron/asar
          asar --version
          $asarFiles = Get-ChildItem "analysis/resources" -Recurse -File -Filter "*.asar" -ErrorAction SilentlyContinue
          Write-Host "ASAR files: $($asarFiles.Count)"
          $asarFiles | ForEach-Object { $_.FullName } | Out-File "analysis/reports/asar-detection.txt" -Encoding utf8
          $index = 0
          foreach ($asar in $asarFiles) {
            $index++
            $name = [System.IO.Path]::GetFileNameWithoutExtension($asar.Name)
            $safeName = $name -replace '[^a-zA-Z0-9._-]', '_'
            $destination = Join-Path "analysis/asar" "${index}_${safeName}"
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Write-Host "Extracting: $($asar.FullName) -> $destination"
            asar extract "$($asar.FullName)" "$destination"
          }
          # JS 静态检索：只读 grep，不执行 JS
          $roots = @("analysis/asar")
          $keys = @('SunBrowser','sunbrowser','user-data-dir','remote-debugging','chrome_152','profile-directory','spawn','execFile','CreateProcess','remote_debugging_port')
          $hits = @()
          foreach ($root in $roots) {
            if (!(Test-Path $root)) { continue }
            $files = Get-ChildItem $root -Recurse -File -Include *.js,*.mjs,*.cjs,*.ts,*.json -ErrorAction SilentlyContinue | Select-Object -First 3000
            foreach ($f in $files) {
              try {
                $m = Select-String -Path $f.FullName -Pattern $keys -SimpleMatch -CaseSensitive:$false -ErrorAction SilentlyContinue | Select-Object -First 5
                foreach ($x in $m) { $hits += "$($f.FullName):$($x.LineNumber): $($x.Line.Trim())" }
              } catch {}
              if ($hits.Count -ge 2000) { break }
            }
          }
          if ($hits.Count -eq 0) { $hits = @("(no SunBrowser launch hits in extracted asar; see pe-triage + Ghidra imports)") }
          $hits | Out-File "analysis/reports/sunbrowser-hits.txt" -Encoding utf8
          Write-Host "sunbrowser-hits: $($hits.Count)"

      # ------------------------------------------------------------
      # 9. .NET / CLR 判定（PE DataDirectory[14]，不靠字符串猜）
      # ------------------------------------------------------------
      - name: Detect .NET CLR
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "analysis/downloads/${env:TARGET_NAME}"
          $bytes = [System.IO.File]::ReadAllBytes($file)
          $isDotNet = $false
          $reason = ""
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            $reason = "Missing DOS MZ signature."
          } else {
            $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -lt 0 -or $peOffset + 24 -gt $bytes.Length) {
              $reason = "Invalid PE header offset."
            } elseif ([System.Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") {
              $reason = "Missing PE signature."
            } else {
              $optionalHeaderSize = [System.BitConverter]::ToUInt16($bytes, $peOffset + 20)
              $optionalOffset = $peOffset + 24
              $optionalEnd = $optionalOffset + $optionalHeaderSize
              if ($optionalEnd -gt $bytes.Length -or $optionalHeaderSize -lt 2) {
                $reason = "Invalid PE optional header."
              } else {
                $optionalMagic = [System.BitConverter]::ToUInt16($bytes, $optionalOffset)
                if ($optionalMagic -eq 0x10B) {
                  $numberOfRvaAndSizesOffset = $optionalOffset + 92
                  $dataDirectoryOffset = $optionalOffset + 96
                } elseif ($optionalMagic -eq 0x20B) {
                  $numberOfRvaAndSizesOffset = $optionalOffset + 108
                  $dataDirectoryOffset = $optionalOffset + 112
                } else {
                  $numberOfRvaAndSizesOffset = -1
                  $dataDirectoryOffset = -1
                  $reason = "Unsupported PE optional-header format."
                }
                $cliDirectoryOffset = $dataDirectoryOffset + (14 * 8)
                if ($dataDirectoryOffset -ge 0 -and $numberOfRvaAndSizesOffset -ge 0 -and
                    $numberOfRvaAndSizesOffset + 4 -le $optionalEnd -and
                    [System.BitConverter]::ToUInt32($bytes, $numberOfRvaAndSizesOffset) -ge 15 -and
                    $cliDirectoryOffset + 8 -le $optionalEnd) {
                  $cliRva = [System.BitConverter]::ToUInt32($bytes, $cliDirectoryOffset)
                  $cliSize = [System.BitConverter]::ToUInt32($bytes, $cliDirectoryOffset + 4)
                  $isDotNet = $cliRva -ne 0 -and $cliSize -ne 0
                  $reason = "CLR directory RVA: 0x{0:X8}; size: {1}." -f $cliRva, $cliSize
                } elseif ($dataDirectoryOffset -ge 0) {
                  $reason = "PE optional header does not expose a complete CLR data-directory entry."
                }
              }
            }
          }
          @("=== .NET / CLR DETECTION ===", "File: $file", "Managed CLR: $isDotNet", "Reason: $reason") |
            Out-File "analysis/dotnet/dotnet-indicators.txt" -Encoding utf8
          if ($isDotNet) { "DOTNET_FOUND=true" >> $env:GITHUB_ENV; Write-Host ".NET detected." }
          else { "DOTNET_FOUND=false" >> $env:GITHUB_ENV; Write-Host "No CLR; skipping ILSpy." }

      - name: Setup .NET
        if: env.DOTNET_FOUND == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.x"

      - name: ILSpy decompile if dotnet
        if: env.DOTNET_FOUND == 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          dotnet tool install --global ilspycmd
          $toolPath = Join-Path $env:USERPROFILE ".dotnet\tools"
          $toolPath >> $env:GITHUB_PATH
          $exe = Resolve-Path "analysis/downloads/${env:TARGET_NAME}"
          $output = Resolve-Path "analysis/dotnet"
          & ilspycmd -p -o "$output" "$exe" *> "analysis/reports/ilspy.log"
          Write-Host "ILSpy exit: $LASTEXITCODE"
          exit 0

      # ------------------------------------------------------------
      # 10. Ghidra headless 全量反编译（不执行样本）
      #     默认 full=true：ExportSunBrowser.java 按名称排序取前1500函数，
      #     每50个一切片写 full-decompiled-*.c
      # ------------------------------------------------------------
      - name: Ghidra headless analyze (full)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $exe = (Resolve-Path "analysis/downloads/${env:TARGET_NAME}").Path
          $proj = (Resolve-Path "analysis/ghidra/proj").Path
          $headless = Join-Path $env:GHIDRA_DIR "support/analyzeHeadless.bat"
          $full = "${{ inputs.full_decompile }}"
          if ([string]::IsNullOrWhiteSpace($full)) { $full = "true" }
          "FULL_DECOMPILE=$full" >> $env:GITHUB_ENV
          Write-Host "headless: $headless"
          Write-Host "exe: $exe"
          Write-Host "full_decompile: $full (Adspower-Global 默认全量)"
          # .py 后缀在 headless 默认走 PyGhidra 会报 Python is not available，
          # 所以用同目录的 ExportSunBrowser.java（Java GhidraScript，headless 可用）。
          & $headless "$proj" AdspowerProj -import "$exe" -postScript ExportSunBrowser.java "$full" -deleteProject -scriptPath ".github/scripts" -max-cpu 4 *> "analysis/reports/ghidra.log"
          Write-Host "Ghidra exit: $LASTEXITCODE"
          Get-Content "analysis/reports/ghidra.log" -Tail 80

      # ------------------------------------------------------------
      # 11. 全量分片打包 + 编码修复（全静态，不执行样本）
      # ------------------------------------------------------------
      - name: Pack shards and fix encoding
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # 文本报告统一转无 BOM UTF8，避免网页预览乱码
          foreach ($tri in @("analysis/reports/pe-triage.txt","analysis/reports/string-hits-sunbrowser.txt","analysis/reports/sunbrowser-hits.txt","analysis/reports/FINAL-REPORT.txt")) {
            if (Test-Path $tri) {
              $raw = [System.IO.File]::ReadAllBytes($tri)
              if ($raw.Length -ge 3 -and $raw[0] -eq 0xEF -and $raw[1] -eq 0xBB -and $raw[2] -eq 0xBF) {
                $raw = $raw[3..($raw.Length - 1)]
              }
              $text = [System.Text.Encoding]::UTF8.GetString($raw)
              [System.IO.File]::WriteAllText($tri, $text, (New-Object System.Text.UTF8Encoding($false)))
            }
          }
          Write-Host "re-encoded reports to utf8-no-bom"
          $shards = @(Get-ChildItem "analysis/ghidra/out" -Filter "full-decompiled-*.c" -ErrorAction SilentlyContinue)
          if ($shards.Count -gt 0) {
            Write-Host "Full shards: $($shards.Count)"
            Compress-Archive -Path "analysis/ghidra/out/full-decompiled-*.c" -DestinationPath "analysis/ghidra/out/full-decompiled.zip" -CompressionLevel Optimal -Force
            $z = Get-Item "analysis/ghidra/out/full-decompiled.zip"
            Write-Host "Packed: $($z.Length) bytes"
          } else {
            Write-Host "No full shards (maybe directional entry-decompiled.c only), skip pack"
          }

      # ------------------------------------------------------------
      # 12. FINAL-REPORT（SunBrowser 启动方法阅读指引）
      # ------------------------------------------------------------
      - name: Generate FINAL-REPORT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $full = "${{ inputs.full_decompile }}"
          if ([string]::IsNullOrWhiteSpace($full)) { $full = "true" }
          Get-ChildItem "analysis/ghidra/out" -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName } |
            Out-File "analysis/reports/filelist.txt" -Encoding utf8
          @(
            "========================================",
            "AdsPower.Global Ghidra 全量反编译报告",
            "========================================",
            "",
            "Target: ${env:TARGET_NAME}",
            "SHA256: ${env:TARGET_SHA256}",
            "full_decompile: $full (本工作流默认全量)",
            "",
            "SunBrowser 启动方法看这几个文件(按顺序):",
            "1. pe-triage.txt                  : PE头/CLR/启动相关字符串计数,先看这个定性(壳/Electron/启动器)",
            "2. string-hits-sunbrowser.txt     : 二进制字符串里 SunBrowser/user-data-dir/remote-debugging 命中",
            "3. sunbrowser-hits.txt            : asar 解包后 JS 里 spawn/execFile/user-data-dir 命令行拼接(真逻辑多半在这)",
            "4. ghidra/out/imports.txt         : 有无 CreateProcessW/ShellExecuteExW/LoadLibrary(是不是启动器)",
            "5. ghidra/out/entry-decompiled.c  : 定向模式入口+关键函数伪C(若full=false才有)",
            "6. ghidra/out/full-decompiled-*.c(.zip) : 全量伪C分片(默认full=true,前1500函数,每50一切片)",
            "7. ghidra/out/function-list.txt   : 函数清单(含地址,搜 WinMain/CreateProcess 交叉引用)",
            "8. ghidra/out/sections.txt        : 内存节表",
            "9. ghidra.log                     : headless运行日志",
            "10. dotnet/dotnet-indicators.txt  : CLR判定,若为True再看 ilspy.log",
            "",
            "对照 launcher/cpp 的已知结论:",
            "--user-data-dir=<数据目录>/<profile> --profile-directory=Default --remote-debugging-port=<自动分配> --no-first-run --no-default-browser-check about:blank",
            "若 JS/Ghidra 命中与该模板一致则结论成立,不一致以本次 artifact 为准。",
            "",
            "注意: 纯静态反编译+只读解包,不执行样本,不能当运行时证据。"
          ) | Out-File "analysis/reports/FINAL-REPORT.txt" -Encoding utf8
          Get-Content "analysis/reports/FINAL-REPORT.txt"

      # ------------------------------------------------------------
      # 13. 上传产物（允许传回 artifact）
      # ------------------------------------------------------------
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdspowerGlobal-ghidra-full
          path: analysis/
          retention-days: 30
          if-no-files-found: warn
