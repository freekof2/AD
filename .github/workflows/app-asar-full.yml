name: App Asar 完整解包

# app.asar 是 Electron ASAR 归档(JS 业务),不是 PE/Ghidra 对象。
# 本工作流: 下载+校验(app.asar + app.asar.unpacked.zip) -> ASAR头解析
# -> asar extract(完整解包,不切片) -> 打包 asar-full.zip(含全部解包文件) -> 上传。
# artifact:
#   AppAsar-full-files: asar-full.zip + package-info.txt + filelist + extstats(要的7375个文件全在这里)
#   AppAsar-triage:    报告类文件(头/哈希/字符串命中),不含原 app.asar 本体。
on:
  workflow_dispatch:
    inputs:
      sample_url:
        description: '样本下载地址(留空用默认值)'
        required: false
        default: ''
      sample_sha256:
        description: '样本SHA256(留空则只记录不校验,因release页未公布)'
        required: false
        default: ''
      unpacked_url:
        description: 'unpacked包下载地址(留空用默认值)'
        required: false
        default: ''
      unpacked_sha256:
        description: 'unpacked包SHA256(留空则只记录不校验)'
        required: false
        default: ''

permissions:
  contents: read

env:
  TARGET_URL: "https://github.com/freekof2/AD/releases/download/1.0.0.1/app.asar"
  TARGET_NAME: "app.asar"
  # release 页未公布 app.asar 的 SHA256,留空表示只记录实际值、不强制比对。
  # 若后续拿到可信摘要,可填入此处或经 inputs.sample_sha256 传入。
  TARGET_SHA256: ""
  TARGET_UNPACKED_URL: "https://github.com/freekof2/AD/releases/download/1.0.0.1/app.asar.unpacked.zip"
  TARGET_UNPACKED_NAME: "app.asar.unpacked.zip"
  # unpacked 包 SHA256 同样留空表示只记录不强制比对,可经 inputs.unpacked_sha256 传入。
  TARGET_UNPACKED_SHA256: ""
  # 上次成功跑出的完整文件数,仅做对账提示(不一致只告警,不断言失败,防版本变更)。
  EXPECTED_FILES: "7375"

jobs:
  # ================================================================
  # 单 job:下载+解包+打包,不切片,一次拿全量文件
  # ================================================================
  extract:
    name: 解包完整文件
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dirs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "analysis/downloads" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis/reports" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis/asar-full" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis/strings" | Out-Null

      - name: Download and verify sample
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "${{ inputs.sample_url }}"
          if ([string]::IsNullOrWhiteSpace($url)) { $url = "${env:TARGET_URL}" }
          $exp = "${{ inputs.sample_sha256 }}"
          if ([string]::IsNullOrWhiteSpace($exp)) { $exp = "${env:TARGET_SHA256}" }
          $exp = $exp.ToLower().Trim()
          $out = "analysis/downloads/${env:TARGET_NAME}"
          Write-Host "URL: $url"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          $f = Get-Item $out
          Write-Host "Size: $($f.Length) bytes"
          $h = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          Write-Host "actual  : $h"
          if ([string]::IsNullOrWhiteSpace($exp)) {
            Write-Host "expected: (empty, record-only)"
            $h | Out-File "analysis/reports/sha256-actual.txt" -Encoding utf8
            Write-Host "SHA256 recorded (no enforcement)"
          } else {
            Write-Host "expected: $exp"
            if ($h -ne $exp) { throw "SHA256 mismatch,拒绝分析" }
            Write-Host "SHA256 OK"
          }
          # 下载 app.asar.unpacked.zip(asar extract 需要它做兄弟目录,否则 sharp/koffi 原生模块报 ENOENT)
          $uurl = "${{ inputs.unpacked_url }}"
          if ([string]::IsNullOrWhiteSpace($uurl)) { $uurl = "${env:TARGET_UNPACKED_URL}" }
          $uexp = "${{ inputs.unpacked_sha256 }}"
          if ([string]::IsNullOrWhiteSpace($uexp)) { $uexp = "${env:TARGET_UNPACKED_SHA256}" }
          $uexp = $uexp.ToLower().Trim()
          $uout = "analysis/downloads/${env:TARGET_UNPACKED_NAME}"
          Write-Host "UNPACKED URL: $uurl"
          Invoke-WebRequest -Uri $uurl -OutFile $uout -UseBasicParsing
          $uf = Get-Item $uout
          Write-Host "Unpacked zip size: $($uf.Length) bytes"
          $uh = (Get-FileHash $uout -Algorithm SHA256).Hash.ToLower()
          Write-Host "unpacked actual  : $uh"
          if ([string]::IsNullOrWhiteSpace($uexp)) {
            Write-Host "unpacked expected: (empty, record-only)"
            $uh | Out-File "analysis/reports/sha256-unpacked-actual.txt" -Encoding utf8
          } else {
            Write-Host "unpacked expected: $uexp"
            if ($uh -ne $uexp) { throw "Unpacked SHA256 mismatch,拒绝分析" }
            Write-Host "Unpacked SHA256 OK"
          }
          Expand-Archive -Path $uout -DestinationPath "analysis/downloads/" -Force
          $udir = "analysis/downloads/app.asar.unpacked"
          if (-not (Test-Path $udir)) {
            # 兼容 zip 根下直接是 node_modules(无顶层 app.asar.unpacked 文件夹)的情况
            if (Test-Path "analysis/downloads/node_modules") {
              New-Item -ItemType Directory -Force -Path "${udir}.tmp" | Out-Null
              Get-ChildItem "analysis/downloads" -Exclude "app.asar","app.asar.unpacked.zip","app.asar.unpacked","app.asar.unpacked.tmp","*.txt" |
                Move-Item -Destination "${udir}.tmp" -Force -ErrorAction SilentlyContinue
              if (Test-Path "${udir}.tmp/node_modules") { Move-Item "${udir}.tmp" $udir -Force }
              else { throw "zip 根结构无法识别,既无 app.asar.unpacked/ 也无 node_modules/" }
            } else { throw "解压后缺 $udir,请检查 zip 根结构(应为 app.asar.unpacked/...)" }
          }
          $ucount = @(Get-ChildItem $udir -Recurse -File -ErrorAction SilentlyContinue).Count
          Write-Host "Unpacked files: $ucount"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # ASAR 头解析 + 完整解包 + 文件清单,全静态,不执行任何 JS
      # 严格模式:extract 失败直接抛错,不像以前 continue-on-error 蒙混过关
      - name: Asar header parse and extract (full, no shards)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $asar = (Resolve-Path "analysis/downloads/${env:TARGET_NAME}").Path
          $bytes = [System.IO.File]::ReadAllBytes($asar)
          Write-Host "Asar bytes: $($bytes.Length)"
          # Chromium Pickle 头: 前 16 字节为 4 个 UInt32,打印出来定性即可
          $head = $bytes[0..([Math]::Min(63, $bytes.Length - 1))]
          $hex = ($head | ForEach-Object { $_.ToString("X2") }) -join " "
          $hex | Out-File "analysis/reports/asar-header-hex.txt" -Encoding utf8
          Write-Host "header64: $hex"
          if ($bytes.Length -ge 16) {
            $u0 = [System.BitConverter]::ToUInt32($bytes, 0)
            $u1 = [System.BitConverter]::ToUInt32($bytes, 4)
            $u2 = [System.BitConverter]::ToUInt32($bytes, 8)
            $u3 = [System.BitConverter]::ToUInt32($bytes, 12)
            @("size=$($bytes.Length)", "u0=$u0", "u1=$u1", "u2=$u2", "u3=$u3") |
              Out-File "analysis/reports/asar-header.txt" -Encoding utf8
            Get-Content "analysis/reports/asar-header.txt"
          }
          npm install --global @electron/asar
          asar --version
          $dest = (Resolve-Path "analysis/asar-full").Path
          Write-Host "Extracting to: $dest"
          asar extract "$asar" "$dest"
          if ($LASTEXITCODE -ne 0) { throw "asar extract 失败,exit=$LASTEXITCODE(检查 app.asar.unpacked 兄弟目录)" }
          Write-Host "asar extract exit: $LASTEXITCODE"
          $all = @(Get-ChildItem $dest -Recurse -File -ErrorAction SilentlyContinue | Sort-Object FullName)
          Write-Host "Extracted files: $($all.Count)"
          $expFiles = "${env:EXPECTED_FILES}"
          if ("$($all.Count)" -ne "$expFiles") {
            Write-Warning "文件数 $($all.Count) 与预期 $expFiles 不一致(版本可能变更,以本次实际为准)"
          } else {
            Write-Host "文件数对账 OK: $($all.Count)"
          }
          $all | Select-Object -ExpandProperty FullName |
            Out-File "analysis/reports/asar-filelist.txt" -Encoding utf8
          $exts = $all | Group-Object { $_.Extension.ToLower() } |
            Sort-Object Count -Descending |
            ForEach-Object { "$($_.Name): $($_.Count)" }
          $exts | Out-File "analysis/reports/asar-extstats.txt" -Encoding utf8
          Get-Content "analysis/reports/asar-extstats.txt" | Select-Object -First 30

      # 流式字符串命中:不写全量 dump,只输出关键词上下文(对齐 exe 工作流)
      - name: Extract string hits (streaming, no full dump)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "analysis/downloads/${env:TARGET_NAME}"
          $bytes = [System.IO.File]::ReadAllBytes($file)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          $pats = @('SunBrowser','sunbrowser','user-data-dir','remote-debugging','chrome_152','profile-directory','no-first-run','about:blank','spawn','execFile','remote_debugging_port','chromedriver','chrome_proxy')
          $hits = @()
          foreach ($p in $pats) {
            $idx = 0
            $count = 0
            while ($count -lt 50) {
              $found = $text.IndexOf($p, $idx, [System.StringComparison]::OrdinalIgnoreCase)
              if ($found -lt 0) { break }
              $s = [Math]::Max(0, $found - 200)
              $e = [Math]::Min($text.Length, $found + $p.Length + 200)
              $ctx = $text.Substring($s, $e - $s) -replace '[^\x20-\x7E]+', ' '
              $ctx = $ctx.Trim()
              if ($ctx.Length -gt 10) { $hits += "[$p @0x$($found.ToString('X8'))] $ctx" }
              $idx = $found + 1
              $count++
            }
          }
          if ($hits.Count -eq 0) { $hits = @("(no SunBrowser launch string hits in raw asar)") }
          $hits | Out-File "analysis/strings/string-hits-sunbrowser.txt" -Encoding utf8
          $hits | Out-File "analysis/reports/string-hits-sunbrowser.txt" -Encoding utf8
          Write-Host "SunBrowser string hits: $($hits.Count)"

      # 打包全部解包文件为单个 zip,并校验 zip 内条目数 == 解包文件数
      - name: Package full extracted files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = (Resolve-Path "analysis/asar-full").Path
          $n = @(Get-ChildItem $src -Recurse -File -ErrorAction SilentlyContinue).Count
          Write-Host "Files to pack: $n"
          if ($n -eq 0) { throw "asar-full 为空,拒绝打包" }
          $zip = "analysis/asar-full.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src/*" -DestinationPath $zip -CompressionLevel Optimal
          $zf = Get-Item $zip
          $zh = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "Zip size: $($zf.Length) bytes"
          Write-Host "Zip sha256: $zh"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zr = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($zr.Entries | Where-Object { $_.FullName -notmatch '/$' })
            Write-Host "Zip entries: $($entries.Count)"
            if ($entries.Count -ne $n) { throw "zip 条目 $($entries.Count) != 解包文件 $n,打包不完整" }
            Write-Host "打包对账 OK: $($entries.Count)/$n"
          } finally { $zr.Dispose() }
          @("files=$n", "zip_bytes=$($zf.Length)", "zip_sha256=$zh") |
            Out-File "analysis/reports/package-info.txt" -Encoding utf8
          $zh | Out-File "analysis/reports/sha256-asar-full-zip.txt" -Encoding utf8
          Get-Content "analysis/reports/package-info.txt"

      # triage 报告 artifact:不含 downloads/app.asar 本体,不含解包全量
      - name: Upload triage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppAsar-triage
          path: |
            analysis/reports/
            analysis/strings/string-hits-sunbrowser.txt
          retention-days: 30
          if-no-files-found: warn

      # 完整文件 artifact:要的全部解包文件都在 asar-full.zip 里
      - name: Upload full files artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppAsar-full-files
          path: |
            analysis/asar-full.zip
            analysis/reports/package-info.txt
            analysis/reports/asar-filelist.txt
            analysis/reports/asar-extstats.txt
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
