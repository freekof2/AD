name: Build SunLauncher App
# 约束：
#   - 只在 windows-latest 上 MSVC 编译 + 离线契约校验 + 打包；
#   - 不在本地测试、不启动 SunBrowser、不连接 AdsPower 云端（无 token、无上报）；
#   - 不开任何监听端口（HTTP 离线接口 18900 + /api/* + web-ui 已整体删除，
#     主窗口原生操作直调内部函数；web-ui/ 目录已从仓库移除，不再打包）；
#   - 产物只压缩一次：upload-artifact 上传 offline-pkg/*（下载即 zip，解压一次即用），
#     工作流内不再手动 Compress-Archive，避免 zip 套 zip。
# 原生指纹窗逻辑即契约（原 web-ui/ 已删除，对照 git 历史）：
#   - 目录即环境：数据目录子目录名 = profile；
#   - 导入：直读目录内 md5(fbcc+"_static/_webrtc/_cookies") 三件套，
#     换表 Base64 解码回填 35+ 指纹表单；CLIENT_HOST 一律剥离，BROWSER_ID 按目录名校正；
#   - 导出/保存：写回三件套（md5 比对一致跳过）+ ui_fingerprint.json 明文侧车（35+ 参数全量）；
#   - 启动：原生启动按钮 -> C++ FpBuildCmdline 注入 --extended-parameters（含
#     StaticConfig/DynamicConfig/CookiesFile 三文件绝对路径 + UserId + fbcc 噪声种子），
#     spawn SunBrowser.exe + --user-data-dir=<profile> --remote-debugging-port=0（官方随机端口，
#     实际值读 profile 目录 DevToolsActivePort，无 ports.json）；
#   - 停止：原生关闭按钮 -> FpKillProfileTree 按 user-data-dir 树杀 + 句柄兜底；
#   - 代理检测：指纹窗内测速按钮，只做本机 TCP connect（3s 超时），
#     不访问任何云端测速接口；
#   - 以缓存为准：UserId/CanvasMark/WebGLMark/AudioFp/ClientRects/ProxyChain/DeviceName/
#     MacAddress/MediaDevices/TTSEngines/Langs/TimeZone/Geoposition/WebRTCAddress/
#     其余保护键以缓存为准；WebRTCAddress/DisableWebRTC 由 native WebRTC 模式解析器
#     按 forward/proxy/disabled 明确同步写入 sunBrowserParams ext + static + dynamic。
# 注：main.min.js 的本地 Koa 路由（/api/openBrowser 等）仅作指纹字段语义的只读对照，
#   不再实现为 HTTP 服务；未知路由概念已不存在（无监听端口）。

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - "ports.json"
      - ".github/workflows/build-app.yml"
permissions:
  contents: read

jobs:
  build:
    name: MSVC build + offline checks + package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SunLauncher (C++17 Win32, Release x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild launcher\cpp\SunLauncher.vcxproj /p:Configuration=Release /p:Platform=x64
          $exe = Get-ChildItem launcher\cpp\x64\Release\SunLauncher.exe -ErrorAction Stop
          Write-Host "built: $($exe.FullName) ($($exe.Length) bytes)"
          if ($exe.Length -lt 10240) { throw "SunLauncher.exe suspiciously small" }
          # 符号产物：PDB + MAP（dumpbin 符号化 0xc0000409 offset 用，随包发布，离线可用）
          $pdb = Get-ChildItem launcher\cpp\x64\Release\*.pdb -ErrorAction SilentlyContinue
          if ($pdb) { Write-Host "symbols: $($pdb.FullName) ($($pdb.Length) bytes)" }
          else { Write-Host "warning: no pdb emitted" }

      - name: Fingerprint WebRTC/WebGL/timezone unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild tests\fp_webrtc_test.vcxproj /p:Configuration=Release /p:Platform=x64
          $testExe = Get-ChildItem tests\x64\Release\fp_webrtc_test.exe -ErrorAction Stop
          & $testExe.FullName
          if ($LASTEXITCODE -ne 0) { throw "WebRTC mode unit test failed: $LASTEXITCODE" }
          Write-Host "Fingerprint mode tests passed"


      - name: Offline contract check (native only, no listen port)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 1. C++ 不得引用云端域名 / token / 云端路由（web-ui 已删除，查 C++ 三文件）
          #    例外：代理 bypass 名单三域名（download/start/sys.adspower.net）是官方要求直连项，
          #    只许出现在 proxy-bypass-list 上下文，单独校验作用域。
          $banned = @("adspower.com", "adspowerapp.com", "loginkits.com", "xmp.one",
                      "acczing.com", "login-token", "apiKey", "api-key", "get-token",
                      "/api/v1/", "/api/v2/", "/api/tabAssistant", "ENV-",
                      "activeProfile", "page-profiles", "page-groups", "xrkClientAPI")
          foreach ($f in @("launcher/cpp/main.cpp", "launcher/cpp/fp_ui.cpp", "launcher/cpp/fingerprint.cpp", "launcher/cpp/util.cpp")) {
            $t = Get-Content $f -Raw
            foreach ($b in $banned) {
              if ($t -match [regex]::Escape($b)) { throw "banned string '$b' in $f" }
            }
            Write-Host "clean: $f"
          }
          $fpBypassScope = (Get-Content launcher\cpp\fingerprint.cpp -Raw) -replace 'download\.adspower\.net|start\.adspower\.net|sys\.adspower\.net', ''
          if ($fpBypassScope -match [regex]::Escape("adspower.net")) { throw "banned string 'adspower.net' outside proxy-bypass list" }
          Write-Host "bypass-domain scope ok (only proxy-bypass-list)"
          # 2. C++ 指纹模块必备符号（换表/三件套/注入/树杀/侧车）
          $cpp = Get-Content launcher\cpp\fingerprint.cpp -Raw
          foreach ($s in @("FpEncode", "FpDecode", "FpMd5Hex", "FpBuildCmdline", "FpKillProfileTree",
                           "FpStaticName", "FpDynamicName", "FpCookiesName", "FpCmdTooLong",
                           "kExtraAllow", "debugConsole",
                           "hTy1bfRJz4nLPcBCO7WtmNIaGvVeul5Zo8kq32UxrYw_-0gsjp96SDFXQiEMKdHA",
                           "ui_fingerprint.json")) {
            if ($cpp -notmatch [regex]::Escape($s)) { throw "missing symbol '$s' in fingerprint.cpp" }
            Write-Host "symbol ok: $s"
          }
          # 2a. ext 防膨胀：白名单外大字段（cookie/raw cookie 全文）不得并入 ext；
          #     ext 超 24000 即超限（CreateProcess 上限 32767，err=206 根因）。
          #     白名单 kExtraAllow 必须存在且包含官方小标量键；ui 大字段不得出现在白名单。
          foreach ($s in @("DisableContainer", "HardwareConcurrency", "GeolocationSetting")) {
            if ($cpp -notmatch [regex]::Escape($s)) { throw "ext allowlist key '$s' missing in fingerprint.cpp" }
            Write-Host "allowlist ok: $s"
          }
          foreach ($s in @('"cookie"', '"language"', '"webglConfig"', '"screenResolution"')) {
            if ($cpp -match ('kExtraAllow[^;]*' + [regex]::Escape($s))) { throw "ui big field $s must not be in kExtraAllow" }
          }
          Write-Host "allowlist excludes ui big fields ok"
          # 2a3. 指纹保存链路：EDIT 上限放宽 + JSON 全转义 + 保存结果日志
          #     （根因：cookie 16KB+ 被 EDIT 默认 30K 截断 / JEsc 未转义 \n\r\t 导致存档断裂）
          $fpcSave = Get-Content launcher\cpp\fp_ui.cpp -Raw
          foreach ($s in @("EM_SETLIMITTEXT", "指纹保存 ui ", "指纹保存 cookies ")) {
            if ($fpcSave -notmatch [regex]::Escape($s)) { throw "missing save-link symbol '$s' in fp_ui.cpp" }
            Write-Host "fpsave ok: $s"
          }
          if ($fpcSave -notmatch '\\u00') { throw "JEsc must escape control chars (\u00XX)" }
          Write-Host "fpsave JEsc full-escape ok"
          # 2a4. 代理链路：表单代理必须落地（static.ProxyChain + 命令行 --proxy-server + diag 现场）
          #     （根因：proxy 只进 ui 存档，static 无 ProxyChain、命令行无开关，改了不生效）
          $fpCpp = Get-Content launcher\cpp\fingerprint.cpp -Raw
          foreach ($s in @("--proxy-server=", "proxy.static=", "proxy.arg=", "--proxy-bypass-list=", "proxy.bypass=")) {
            if ($fpCpp -notmatch [regex]::Escape($s)) { throw "missing proxy-link symbol '$s' in fingerprint.cpp" }
            Write-Host "proxy ok: $s"
          }
          $fpcProxy = Get-Content launcher\cpp\fp_ui.cpp -Raw
          foreach ($s in @('"ProxyChain"', "指纹保存 static ")) {
            if ($fpcProxy -notmatch [regex]::Escape($s)) { throw "missing proxy-save symbol '$s' in fp_ui.cpp" }
            Write-Host "proxysave ok: $s"
          }
          # 2a5. 代理回填：ui 存档优先，static 仅后备（根因：static 旧值无条件覆盖 ui 新值，
          #     改了 SOCKS5 下次打开看不到，表现为“没有保存”）
          foreach ($s in @("uiHasProxyHost", "指纹载入 代理=ui存档", "指纹载入 代理=static后备")) {
            if ($fpcProxy -notmatch [regex]::Escape($s)) { throw "missing proxy-fill symbol '$s' in fp_ui.cpp" }
            Write-Host "proxyfill ok: $s"
          }
          # 2a5b. 全量回填：ui 缺失键才用 static/dynamic 补（Langs/Platform/CPU/RAM/设备/MAC/
          #      媒体/语音/时区/噪音/WebRTC），ui 有值不覆盖；WebRTC IP 缺失时再从配置文件补。
          foreach ($s in @("uiHasLangs", "ui 存档优先", "static 仅补 ui 缺失的键")) {
            if ($fpcProxy -notmatch [regex]::Escape($s)) { throw "missing fill-all symbol '$s' in fp_ui.cpp" }
            Write-Host "fillall ok: $s"
          }
          # 2a5b2. 无 ui 存档后备（k1hf7t36 实测：official 环境只有三件套，打开即默认值）：
          #      地理模式读 GeolocationSetting；白名单读 AllowScanPorts；代理账号密码读
          #      account/password；伪装 IP 读 WebRTCLocalAddress；媒体三数量按 kind 数数组；
          #      语音按非空 TTSEngines 数组开；Canvas/WebGL 种子恒存在≠开启，留默认。
          foreach ($s in @("GeolocationSetting", "AllowScanPorts", "WebRTCLocalAddress",
                           """account""", """password""", """audioinput""", "TTSEngines",
                           "恒存在")) {
            if ($fpcProxy -notmatch [regex]::Escape($s)) { throw "missingui-less fallback symbol '$s' in fp_ui.cpp" }
            Write-Host "uiless ok: $s"
          }
          # 2a5b3. Config.json 按环境名存完整 profile 路径 + sun_browser_dir + webrtc_ip；
          #      打开时按 profile 覆盖、保存同步成对象；兼容旧纯字符串 IP 条目。
          foreach ($s in @("Config.json", "FpConfigSpoofIpRaw", "FpConfigSpoofIpSet",
                           "FpConfigSyncProfileDirs", "FpConfigRemoveKey", "data_dir", "sun_browser_dir",
                           "webrtc_ip", "FpImportSourceProfileDir", "完整 profile 输入只作为源")) {
            if ($fpcProxy -notmatch [regex]::Escape($s)) { throw "missing spoofip-config symbol '$s' in fp_ui.cpp" }
            Write-Host "spoofcfg ok: $s"
          }
          $fpImportHeader = Get-Content launcher\cpp\fp_browser_config.h -Raw
          foreach ($s in @("FpResolveImportSourcePath", "hasFingerprintFiles", "Never infer profile-ness from underscores")) {
            if ($fpImportHeader -notmatch [regex]::Escape($s)) { throw "missing import path resolver '$s'" }
            Write-Host "importpath ok: $s"
          }
          $fpModeTests = Get-Content tests\fp_webrtc_test.cpp -Raw
          foreach ($s in @("fullProfile", "parentWithUnderscore", "currentProfilePath")) {
            if ($fpModeTests -notmatch [regex]::Escape($s)) { throw "missing import path regression case '$s'" }
            Write-Host "import-path test ok: $s"
          }
          foreach ($s in @("input=", "direct=", "targetParent=", "FpLoadUiExtra(srcDir, ui2)",
                           "FpBackfillWebGl(w->form, ui2")) {
            if ($fpcProxy -notmatch [regex]::Escape($s)) { throw "missing import execution path '$s' in fp_ui.cpp" }
            Write-Host "importflow ok: $s"
          }
          foreach ($s in @("browserControl=", "指纹浏览器目录已收集 form=", "Config.json 目录同步输入")) {
            if ($fpcProxy -notmatch [regex]::Escape($s)) { throw "missing profile browser-directory save diagnostic '$s'" }
            Write-Host "browserdir-save ok: $s"
          }
          $utilCfg = Get-Content launcher\cpp\util.cpp -Raw
          foreach ($s in @("ApplyConfigJsonProfiles", "Config.json 指纹目录", "完整指纹目录")) {
            if ($utilCfg -notmatch [regex]::Escape($s)) { throw "Config.json profile-directory symbol '$s' missing in util.cpp" }
            Write-Host "config-profile ok: $s"
          }
          # 默认数据目录 + config.json 首启自建：exe 同目录 cache、缺失时按初始参数建文件、
          # 顶层 data_dir/sun_browser_dir 可手改且优先于 sunlauncher.json。
          foreach ($s in @("EnsureConfigJson", "DefaultDataDir", "已创建 Config.json 初始参数",
                           "Config.json 全局 dataDir", "Config.json 全局 browserDir",
                           "DefaultDataDir() { return ExeDir()", "CreateDirectoryW(c.dataDir.c_str()")) {
            if ($utilCfg -notmatch [regex]::Escape($s)) { throw "default cache/config symbol '$s' missing in util.cpp" }
            Write-Host "defaultcfg ok: $s"
          }
          foreach ($s in @("Config.json 目录同步输入", "FpJsonSet failed", "指纹保存收集目录")) {
            if ($fpcProxy -notmatch [regex]::Escape($s)) { throw "missing browser-dir save diagnostic '$s'" }
          }
          # 2a5c. per-profile 独立目录：指纹窗口顶端 A2 行（空=跟随全局），只存 sunlauncher.json
          #     注意：$fpc 在下方 2d 节才赋值，此处用独立变量重读，避免空变量误报缺失
          $fpcProf = Get-Content launcher\cpp\fp_ui.cpp -Raw
          $mcppProf = Get-Content launcher\cpp\main.cpp -Raw
          $fhProf = Get-Content launcher\cpp\fp_ui.h -Raw
          $hProf = Get-Content launcher\cpp\SunLauncher.h -Raw
          foreach ($s in @("F_PDATADIR", "F_PBROWSERDIR", "F_BROWSEDATA", "F_BROWSEBROWSER",
                           "FpPageProc", "SetWindowSubclass", "SHBrowseForFolderW", "GetOpenFileNameW",
                           "profDataDir", "profBrowserDir",
                           "指纹保存 profiles目录", "EffDataDir", "EffBrowserDir", "diag 独立目录生效")) {
            $hit = ($fpcProf -match [regex]::Escape($s)) -or ($mcppProf -match [regex]::Escape($s)) -or ($fhProf -match [regex]::Escape($s)) -or ($hProf -match [regex]::Escape($s))
            if (-not $hit) { throw "missing per-profile-dir symbol '$s'" }
            Write-Host "profdir ok: $s"
          }
          # 2a5d. 语言三键对齐（k1h60tsv 实测：AcceptLang 缺失致浏览器中文显示错乱）：
          #     旧 /api/fp/save（已删除）对 Langs/AcceptLang 放行表单新值；打开/导入回填同表。
          #     原生 F_OK 等价逻辑是 forceForm（语言三键+代理表单优先，见 fp_ui.cpp）。
          foreach ($s in @("pageLanguageSwitch", "AcceptLang", "buildAccept", "forceForm")) {
            $hit = ($fpcProf -match [regex]::Escape($s)) -or ($mcppProf -match [regex]::Escape($s))
            if (-not $hit) { throw "missing lang-align symbol '$s'" }
            Write-Host "langalign ok: $s"
          }
          # 2a5e. F_IMPORT 全覆盖（与打开回填同表，导入同样对齐，不止语言代理）。
          if ($fpcProf -notmatch "F_IMPORT 全覆盖") { throw "F_IMPORT full-cover comment missing" }
          Write-Host "fimport-cover ok"
          # 2a6. 精确树杀：多开互不干扰（根因：旧树杀全杀同名 SunBrowser，
          #     起第二个 profile 时把第一个的浏览器杀掉，一个能开网址一个不能）
          #     注意：$fpCpp 在上方 2a4 节已赋值，此处直接复用（同文件作用域内）。
          foreach ($s in @("ProcCmdlineHasDir", "NtQueryInformationProcess", "启动前清场(仅本profile)")) {
            $hit = ($fpCpp -match [regex]::Escape($s)) -or ((Get-Content launcher\cpp\main.cpp -Raw) -match [regex]::Escape($s))
            if (-not $hit) { throw "missing treekill symbol '$s'" }
            Write-Host "treekill ok: $s"
          }
          # 2a7. 新建命名规范 + Network 自愈提示（根因：非法名目录三件套错位；
          #     k1c6pr18 的 Network 缓存坏导致单 profile 刷 Network service crashed）
          $mc2 = Get-Content launcher\cpp\main.cpp -Raw
          foreach ($s in @("新建 profile 名补 _local 后缀", "已存在 ", "diag Network目录存在")) {
            if ($mc2 -notmatch [regex]::Escape($s)) { throw "missing create-link symbol '$s' in main.cpp" }
            Write-Host "createlink ok: $s"
          }
          # 2a8. 保存目录防闪退已删除（主窗口无全局目录区，无 SAVEDIR 分支）：
          #     若 IDC_SAVEDIR 重现即回归
          if ($mc2 -match "IDC_SAVEDIR") { throw "IDC_SAVEDIR should be removed (no global dirs)" }
          Write-Host "nosavedir ok"
          # 2b. 原生指纹窗口模块（web-ui 1:1 纯原生重写，字段与 collectFp/applyUiExtra 对齐）
          $fph = Get-Content launcher\cpp\fp_ui.h -Raw
          foreach ($s in @("FpFormData", "proxyPass", "mediaDevices", "webglMeta", "webgpu",
                           "cpuMode", "ramMode", "devNameMode", "macMode", "doNotTrack",
                           "portScan", "hardwareAccel", "disableTls", "launchArgs",
                           "FpUiShowModal", "FpFormToUiJson", "FpFormFromUiJson", "FpFormToFpConfig",
                           "FpOsToAsarPlatform", "FpBuildDisabledFontsJson", "FpBuildFakefontsJson")) {
            if ($fph -notmatch [regex]::Escape($s)) { throw "missing symbol '$s' in fp_ui.h" }
            Write-Host "fp_ui.h ok: $s"
          }
          $fpc = Get-Content launcher\cpp\fp_ui.cpp -Raw
          foreach ($s in @("FpFormToUiJson", "FpFormFromUiJson", "FpFormToFpConfig",
                           "FpBuildUA", "FpRandomMac", "FpRandomDev",
                           "audioinput_num", "videoinput_num", "audiooutput_num",
                           "webgl_config", "webgpu_switch", "gpu_adapterinfo_vendor",
                           "mac_address_config", "device_name_switch",
                           "FpBuildPages", "FpFill", "FpCollect", "FpUiShowModal",
                           "proxyPass", "FpSaveUiExtra", "FpSaveCookiesJson",
                           "clampMedia", "syncUaPresetFromUA", "parseCookieRaw", "btnFpRandom",
                           "kAsarFontsU", "kAsarMobileFonts", "kAsarFontsUCount",
                           "FpOsToAsarPlatform", "FpBuildDisabledFontsJson", "FpBuildFakefontsJson",
                           "Caurier Regular")) {
            if ($fpc -notmatch [regex]::Escape($s)) { throw "missing symbol '$s' in fp_ui.cpp" }
            Write-Host "fp_ui.cpp ok: $s"
          }
          # 2d2. 字体表 1:1 行级校验（181 条 u[] + 12 条 mobile，顺序无关、数量与笔误必须一致）
          $asarU = ([regex]::Matches($fpc, 'L"[A-Za-z][^"]*"')) | ForEach-Object { $_.Value }
          if ($fpc -notmatch "kAsarFontsUCount = 181") { throw "kAsarFontsUCount != 181" }
          if ($fpc -notmatch "kAsarMobileFontsCount = 12") { throw "kAsarMobileFontsCount != 12" }
          Write-Host "font table counts ok (u=181, mobile=12)"
          # 2d. 原生指纹设置内容自洽（选项值/默认值/行为一致性，原 web-ui 已删除）
          $fpc2 = Get-Content launcher\cpp\fp_ui.cpp -Raw
          # (a) WebRTC 四选项：forward/proxy/disabled/disable_udp
          foreach ($v in @("forward", "proxy", "disabled", "disable_udp")) {
            if ($fpc2 -notmatch [regex]::Escape($v)) { throw "webrtc option '$v' missing in fp_ui.cpp" }
          }
          Write-Host "webrtc options ok"
          # WebRTC 伪装 IP + 实际 static/dynamic 配置写回契约
          $rtcHeader = Get-Content launcher\cpp\fp_webrtc.h -Raw
          foreach ($s in @("FpResolveWebRtc", "InetPtonW", "proxyIpMissing", "proxyIpIgnored", "disableWebRtc")) {
            if ($rtcHeader -notmatch [regex]::Escape($s)) { throw "WebRTC resolver contract '$s' missing" }
          }
          foreach ($s in @("webrtcIp", "F_WEBRTCIP", "FpSaveDynamicJson", "WebRTCAddress", "DisableWebRTC", "代理模式缺少有效 IP", "当前选择 forward", "切换到 proxy 模式后保存")) {
            if ($fpc2 -notmatch [regex]::Escape($s)) { throw "WebRTC persistence contract '$s' missing in fp_ui.cpp" }
          }
          foreach ($s in @("FpBackfillWebGl", "webgl_config", "UNMASKED_VENDOR_WEBGL", "GPUAdapterInfo")) {
            if ($fpc2 -notmatch [regex]::Escape($s)) { throw "WebGL metadata contract '$s' missing in fp_ui.cpp" }
          }
          foreach ($s in @("FpNormalizeTimezone", "FpBrowserConfigJsonQuote", "TimeZone")) {
            if ($fpc2 -notmatch [regex]::Escape($s)) { throw "timezone save contract '$s' missing in fp_ui.cpp" }
          }
          # Cookie 保存守卫（原生指纹窗多行可编辑 + 非法/为空不覆盖既有值 + 长度日志）
          foreach ($s in @("Cookie 保存守卫", "ES_MULTILINE", "指纹回填 cookie len", "Cookie框变空", "指纹载入 ui侧车 cookie", "FpLoadCookiesJson")) {
            if ($fpc2 -notmatch [regex]::Escape($s)) { throw "cookie guard contract '$s' missing in fp_ui.cpp" }
          }
          Write-Host "cookie guard contract ok (native only)"
          $rtcFpCpp = Get-Content launcher\cpp\fingerprint.cpp -Raw
          foreach ($s in @("webrtc.mode=", "FpBuildWebRtcSunParams", "sunBrowserParams.WebRTCAddress",
                           "ext.webrtc.disabled=", "FpBuildTimeZoneSunParam", "WebGLFP",
                           "FpBuildWebGlConfigJson", "ext.settings.timezone=",
                           "webrtc-ip-handling-policy=disable_non_proxied_udp")) {
            if ($rtcFpCpp -notmatch [regex]::Escape($s)) { throw "fingerprint launch/diagnostic contract '$s' missing" }
          }
          Write-Host "webrtc persistence contract ok"
          # 起始页：Config.json 顶层 start_url（第二个顶层参数，手改即生效）；
          # 非法/缺键回落 about:blank，diag 必须回显当前实际起始页。
          foreach ($s in @("FpStartUrl", "start_url", "start.url=",
                           'cmd += L" " + FpStartUrl();')) {
            if ($rtcFpCpp -notmatch [regex]::Escape($s)) { throw "start-url contract '$s' missing in fingerprint.cpp" }
          }
          Write-Host "starturl contract ok"
          # (b) 地理三态 ask/allow/block + 时区 Asia/Shanghai 默认 + 默认经纬度
          foreach ($v in @("ask - ", "allow - ", "block - ", "Asia/Shanghai", "31.2304", "121.4737")) {
            if ($fpc2 -notmatch [regex]::Escape($v)) { throw "geo/tz default '$v' missing in fp_ui.cpp" }
          }
          Write-Host "geo/tz defaults ok"
          # (c) 开关默认值：Canvas关/WebGL关/Audio开/ClientRects开/Speech开
          if ($fpc2 -notmatch "swCanvas = false") { throw "swCanvas default mismatch" }
          if ($fpc2 -notmatch "swAudio = true") { throw "swAudio default mismatch" }
          Write-Host "switch defaults ok"
          # (d) CPU 默认 20、RAM 默认 8、UA 默认 152（原生指纹窗默认值）
          foreach ($v in @('"20"', '"8"')) {
            if ($fpc2 -notmatch [regex]::Escape($v)) { throw "native default '$v' missing in fp_ui.cpp" }
          }
          if ($fpc2 -notmatch '"152"') { throw "native UA default 152 missing in fp_ui.cpp" }
          Write-Host "cpu/ram/ua defaults ok"
          # (e) 随机库：渲染器 5 项、字体 3 项
          if ($fpc2 -notmatch "Apple M1 Max") { throw "renderer list incomplete in fp_ui.cpp" }
          if ($fpc2 -notmatch "San Francisco, Monaco") { throw "font presets incomplete in fp_ui.cpp" }
          Write-Host "random libs ok"
          # (f) 一键随机含精度 500~3500
          if ($fpc2 -notmatch "rand\(\) % 3000 \+ 500") { throw "random accuracy range missing in fp_ui.cpp" }
          Write-Host "random accuracy ok"
          # (g) 语言计数分隔符：逗号/分号/换行（查注释行）
          if ($fpc2 -notmatch '按逗号/分号/换行切分计数') { throw "lang split separators missing in fp_ui.cpp" }
          Write-Host "lang split ok"
          # (h) 字体切分含中文逗号 U+FF0C
          if ($fpc2 -notmatch "0xEF") { throw "fonts chinese-comma handling missing in fp_ui.cpp" }
          Write-Host "fonts split ok"
          # 2c. vcxproj 必须编译新模块
          $vcx = Get-Content launcher\cpp\SunLauncher.vcxproj -Raw
          foreach ($s in @("fp_ui.cpp", "fp_ui.h", "fp_webrtc.h", "fp_browser_config.h")) {
            if ($vcx -notmatch [regex]::Escape($s)) { throw "missing '$s' in vcxproj" }
            Write-Host "vcxproj ok: $s"
          }
          # 2d. 注释溯源：关键函数名必须出现在 fp_ui.cpp（防实现漂移）
          foreach ($s in @("clampMedia", "syncUaPresetFromUA", "parseCookieRaw", "btnFpRandom")) {
            if ($fpc -notmatch $s) { throw "alignment comment '$s' missing in fp_ui.cpp" }
            Write-Host "align comment ok: $s"
          }
          # 2e. 主窗口几何（760x660，LISTVIEW 三列占满左侧，批量行/新建行/状态条互不重叠）
          #     无全局目录区：路径只在指纹配置 A2 行按指纹独立设置（Eff* 解析）
          #     右列操作按钮靠右对齐（x=606，无打开日志目录按钮；主窗口无 DEBUG 日志框）
          $mcpp = Get-Content launcher\cpp\main.cpp -Raw
          # ListView 插行只能指定主列 subitem=0；目录名/状态必须后续写入 subitem 1/2（无端口列）。
          $refreshStart = $mcpp.IndexOf("static void RefreshList()")
          $refreshEnd = $mcpp.IndexOf("// 从 LISTVIEW 当前选中行", $refreshStart)
          if ($refreshStart -lt 0 -or $refreshEnd -le $refreshStart) { throw "RefreshList body not found" }
          $refreshBody = $mcpp.Substring($refreshStart, $refreshEnd - $refreshStart)
          if ($refreshBody -notmatch '(?s)li\.iSubItem\s*=\s*0;.*?li\.pszText\s*=\s*\(LPWSTR\)r\.remark\.c_str\(\);.*?LVM_INSERTITEMW') {
            throw "LVM_INSERTITEMW must insert primary remark column (subitem 0)"
          }
          if ($refreshBody -notmatch '(?s)liName\.iSubItem\s*=\s*1;.*?liName\.pszText\s*=\s*\(LPWSTR\)r\.name\.c_str\(\)') {
            throw "profile name must be written to ListView subitem 1 after insert"
          }
          Write-Host "listview primary/subitem contract ok"
          foreach ($s in @("12, 12, 582, 494", "606, 12, 100",
                           "760, 660", "WC_LISTVIEWW", "LVS_REPORT", "LVS_EX_CHECKBOXES",
                           "LVS_EX_FULLROWSELECT", "LVN_ITEMCHANGED", "NM_CUSTOMDRAW",
                           "kUiBg", "kUiPanel", "kUiSuccess", "kUiMuted",
                           "LVM_INSERTITEMW", "LVM_SETITEMTEXTW", "LVM_DELETEALLITEMS",
                           "LVM_GETNEXTITEM", "LVNI_SELECTED", "LVM_SETITEMSTATE",
                           "LVIS_SELECTED", "LVIS_STATEIMAGEMASK")) {
            if ($mcpp -notmatch [regex]::Escape($s)) { throw "main-window symbol '$s' missing in main.cpp" }
            Write-Host "mainwin ok: $s"
          }
          # 三列：备注249/环境目录190/状态120（备注第0列，环境目录第1列，状态第2列）
          foreach ($s in @("L`"备注`"", "L`"环境目录`"", "L`"状态`"",
                           "c0.cx = 249", "c1.cx = 190", "c2.cx = 120",
                           "FpProfileRemark", "FpJsonUnquote", "FpLoadUiExtra")) {
            if ($mcpp -notmatch [regex]::Escape($s) -and
                (Get-Content launcher\cpp\fingerprint.cpp -Raw) -notmatch [regex]::Escape($s) -and
                (Get-Content launcher\cpp\util.cpp -Raw) -notmatch [regex]::Escape($s)) {
              throw "remark-col symbol '$s' missing"
            }
            Write-Host "remarkcol ok: $s"
          }
          # 端口列不得重现（省下的宽度已给备注 185->249）
          if ($mcpp -match 'L"端口"') { throw "port column must not return to the profile list" }
          if ($refreshBody -match 'iSubItem\s*=\s*3') { throw "subitem 3 (port) write must stay removed" }
          Write-Host "noportcol ok"
          # 端口跟随官方：不分配端口、无端口表，只从 DevToolsActivePort 读实际端口
          $utilCpp = Get-Content launcher\cpp\util.cpp -Raw
          foreach ($s in @("ReadDevToolsPort", "DevToolsActivePort", "--remote-debugging-port=0")) {
            $hit = ($utilCpp -match [regex]::Escape($s)) -or ($mcpp -match [regex]::Escape($s))
            if (-not $hit) { throw "official-port symbol '$s' missing" }
            Write-Host "officialport ok: $s"
          }
          foreach ($bad in @("g.ports", "AllocPortLocked", "SavePorts(", "LoadPorts(", "PortFree(")) {
            if ($mcpp -match [regex]::Escape($bad)) { throw "port-table legacy symbol '$bad' still in main.cpp" }
            if ($utilCpp -match [regex]::Escape($bad)) { throw "port-table legacy symbol '$bad' still in util.cpp" }
            Write-Host "noporttable ok: $bad"
          }
          # 旧 sunlauncher.json 的端口基数配置不再读写（键名出现只允许在说明性注释里）
          if ($utilCpp -match 'JsonGet\(txt,\s*L"port_base"\)' -or $utilCpp -match '"port_base": ') {
            throw "port_base config must no longer be read/written"
          }
          Write-Host "noportbase ok"
          # 搜索+批量行在窗口底部 y=564/566（底 594），与状态条 y=598 不重叠；主窗口无 DEBUG 日志框
          foreach ($s in @("292, 564, 88", "396, 564, 88", "500, 564, 88",
                           "12, 568, 40", "56, 566, 220",
                           "12, 598, 694")) {
            if ($mcpp -notmatch [regex]::Escape($s)) { throw "main-window rect '$s' missing in main.cpp" }
            Write-Host "mainrect ok: $s"
          }
          # 右列纵向靠右对齐：启动12/关闭50/刷新88/指纹126
          foreach ($s in @("606, 12, 100", "606, 50, 100", "606, 88, 100", "606, 126, 100")) {
            if ($mcpp -notmatch [regex]::Escape($s)) { throw "right-col rect '$s' missing in main.cpp" }
            Write-Host "rightcol ok: $s"
          }
          # 新建环境行（搜索行上方，同行：标签12,528宽92/输入110,526宽380/按钮498,524）
          foreach ($s in @("12, 528, 92", "110, 526, 380", "498, 524, 100")) {
            if ($mcpp -notmatch [regex]::Escape($s)) { throw "newenv-row rect '$s' missing in main.cpp" }
            Write-Host "newenvrow ok: $s"
          }
          if ($mcpp -notmatch [regex]::Escape("指纹保存后已重载目录配置")) {
            throw "main config snapshot must reload after fingerprint save"
          }
          Write-Host "main config reload after fingerprint save ok"
          # DEBUG 日志框及相关符号已删除（无清空按钮/日志框控件/窗口回显刷新；日志只写 debug.log 文件）
          foreach ($s in @("IDC_OPENDIR", "IDC_CLEARLOG", "IDC_LOG", "RefreshLogView", "AppendLog", "g.hLog",
                            "hLog =", "打开日志目录", "清空日志窗", "12, 416, 694", "12, 440, 694")) {
            if ($mcpp -match [regex]::Escape($s)) { throw "removed log view '$s' still in main.cpp" }
            Write-Host "nologview ok: $s gone"
          }
          # 主窗口无全局目录残留（DATADIR/BROWSERDIR/SAVEDIR 控件与读写已删除）
          foreach ($s in @("IDC_DATADIR", "IDC_BROWSERDIR", "IDC_SAVEDIR", "hDataDir", "hBrowserDir")) {
            if ($mcpp -match [regex]::Escape($s)) { throw "legacy global-dir symbol '$s' still in main.cpp" }
            Write-Host "noglobaldir ok: $s"
          }
          # 旧 LISTBOX 残留不得出现（LB_ADDSTRING/LB_GETTEXT/LB_RESETCONTENT/LB_GETCURSEL/LBS_NOTIFY）
          foreach ($s in @("LB_ADDSTRING", "LB_GETTEXT", "LB_RESETCONTENT", "LB_GETCURSEL", "LBS_NOTIFY")) {
            if ($mcpp -match [regex]::Escape($s)) { throw "legacy LISTBOX '$s' still in main.cpp" }
            Write-Host "nolb ok: $s"
          }
          # 2f. 指纹单页（860x640 滚动，无 Tab；数据层符号保留；去重后内容高 1744）
          #     A 区只留浏览器下拉 + 数据目录 + 浏览器目录（指纹目录=数据目录+环境名，不单列；
          #     内核由浏览器目录尾段推导，不单独下拉）。
          #     数据目录显示完整指纹目录（与 Config.json data_dir 同形），收集时还原成父目录。
          foreach ($s in @("kFpWinW = 860", "kFpWinH = 640", "kFpContentW = 828", "kFpContentH = 1744",
                           "F_PDATADIR", "F_PBROWSERDIR", "F_BROWSEDATA", "F_BROWSEBROWSER",
                           "SHBrowseForFolderW", "GetOpenFileNameW", "SunBrowser.exe",
                           "FpMkScroll", "FpScrollTo", "FpScrollInit", "WS_VSCROLL",
                           "SW_SCROLLCHILDREN", "SB_THUMBTRACK", "WM_MOUSEWHEEL",
                           "完整指纹目录", "FpDataParentFromProfileOrParent")) {
            if ($fpc -notmatch [regex]::Escape($s)) { throw "single-page symbol '$s' missing in fp_ui.cpp" }
            Write-Host "singlepage ok: $s"
          }
          # 去重回归：指纹目录单列行与内核下拉不得重现（与数据目录/浏览器目录同参数）
          foreach ($s in @("F_BDIR", "F_KERNEL", "F_BROWSEFP")) {
            if ($fpc -match [regex]::Escape($s)) { throw "deduped symbol '$s' still in fp_ui.cpp" }
            Write-Host "dedup ok: $s gone"
          }
          # 时区回填不得把下划线转空格（k1hhv9wo 实测：dynamic TimeZone=America/New_York
          # 转空格后下拉精确匹配失败，回退首项 Etc/GMT+12，一次保存即永久覆盖真实时区）
          if ($fpc -match [regex]::Escape("if (c == '_') c = ' '")) { throw "lossy timezone underscore-to-space conversion still in fp_ui.cpp" }
          Write-Host "tz-nospace ok"
          # 时区显示前必须归一化（兼容旧空格存档），否则精确匹配失败同样回退首项
          if ($fpc -notmatch [regex]::Escape("FpNormalizeTimezone(N(f.timezone))")) { throw "timezone normalize-before-select missing in fp_ui.cpp" }
          Write-Host "tz-normalize ok"
          # 2f2. 语言三键对齐（main.min.js setLangs/setUILanguage 实测）：
          #     界面语言决定 --lang（浏览器 UI 中文/英文）；语言列表决定 Langs/AcceptLang。
          #     k1h60tsv 实测：AcceptLang=en-US,en;q=0.9 由 getAccept 派生，保存必写。
          #     启动必须带 --lang 单tag，否则中文系统默认中文 UI（本次根因）。
          foreach ($s in @("pageLanguageSwitch", "AcceptLang", "buildAccept", "Langs")) {
            if ($fpc -notmatch [regex]::Escape($s)) { throw "lang-align symbol '$s' missing in fp_ui.cpp" }
            Write-Host "langalign ok: $s"
          }
          foreach ($s in @("FpParseLangList", "FpCompatiLangs", "FpGetUILanguage", "FpSingleLangTag", "FpResolveLangArg", "--lang=")) {
            if ($fpCpp -notmatch [regex]::Escape($s)) { throw "lang-cmd symbol '$s' missing in fingerprint.cpp" }
            Write-Host "langcmd ok: $s"
          }
          # Tab 残留不得出现（WC_TABCONTROLW/TCM_INSERTITEMW/TCN_SELCHANGE/kTabNames/FpMkPanel/sPanels/hTab）
          foreach ($s in @("WC_TABCONTROLW", "TCM_INSERTITEMW", "TCN_SELCHANGE", "kTabNames", "FpMkPanel")) {
            if ($fpc -match [regex]::Escape($s)) { throw "legacy Tab '$s' still in fp_ui.cpp" }
            Write-Host "notab ok: $s"
          }
          if ($fpc -match "sPanels\[") { throw "legacy sPanels still in fp_ui.cpp" }
          if ($fpc -match "w->hTab") { throw "legacy hTab still in fp_ui.cpp" }
          Write-Host "notab state ok"
          # 底部按钮行 y=564：随机 8..108 / 保存 636..736 / 取消 744..844，互不重叠且在 860 内
          foreach ($s in @("8, 564, 100", "636, 564, 100", "744, 564, 100", "120, 568, 500")) {
            if ($fpc -notmatch [regex]::Escape($s)) { throw "bottom-row rect '$s' missing in fp_ui.cpp" }
            Write-Host "bottomrow ok: $s"
          }
          # 模态退出语义：子窗口 WM_DESTROY 绝不能调用 PostQuitMessage（否则取消=退出主程序）；
          # 模态循环退出条件只看 IsWindow。检查限定在 FpWndProc 函数代码行（排除注释行，避免误报）。
          foreach ($s in @("绝不能 PostQuitMessage", "只看 IsWindow", "while (::IsWindow(h)")) {
            if ($fpc -notmatch [regex]::Escape($s)) { throw "modal-exit guard '$s' missing in fp_ui.cpp" }
            Write-Host "modalexit ok: $s"
          }
          $codeLines = (Get-Content launcher\cpp\fp_ui.cpp) | Where-Object { $_ -notmatch '^\s*//' }
          $wp0 = ($codeLines | Select-String "static LRESULT CALLBACK FpWndProc" | Select-Object -First 1).LineNumber
          $wp1 = ($codeLines | Select-String "^bool FpUiShowModal" | Select-Object -First 1).LineNumber
          $wproc = ($codeLines[($wp0 - 1)..($wp1 - 2)] -join "`n")
          if ($wproc -match "::PostQuitMessage") { throw "PostQuitMessage still in FpWndProc code" }
          Write-Host "noquit in wndproc ok"
          # 内容区无重叠回归（A2 行新增后整体下移 48：噪音行 988/1012 + 媒体行 1014/1040
          # + CPU 1278 / RAM 1320 / MAC 1404 / 白名单 1488 / 启动参数 1614）
          foreach ($s in @("260, 904, 80", "12, 988, 130", "150, 988, 150", "12, 1012, 130",
                           "150, 1014, 80", "100, 1040, 150", "260, 1040, 60",
                           "12, 1278, 80", "12, 1320, 80", "100, 1402, 150",
                           "12, 1488, 90", "12, 1614, 90")) {
            if ($fpc -notmatch [regex]::Escape($s)) { throw "content rect '$s' missing in fp_ui.cpp" }
            Write-Host "contentrect ok: $s"
          }
          # 旧重叠坐标不得残留（Tab 5 页时代的错误 y：130/156 噪音行、112 MAC、46 CPU/RAM/白名单、146 启动参数、42 换一换）
          foreach ($s in @('L"换一换", 260, 42, 80', 'L"MAC", 12, 1356, 80', 'FpMkCombo(p, w, F_MACM, 100, 112, 150')) {
            if ($fpc -match [regex]::Escape($s)) { throw "legacy overlap rect still in fp_ui.cpp" }
            Write-Host "nooverlap ok"
          }
          # 单页各区域顺序锚点（A/A2/B/C + 指纹项；Tab/section 布局不回退）
          foreach ($s in @("---- A. 浏览器", "---- A2. 数据目录", "---- B. 系统/UA", "---- C. 代理",
                           "---- 1. WebRTC", "---- 6. 分辨率", "---- 8. 硬件噪音",
                           "---- 9. WebGL", "---- 10. WebGPU", "---- 11. CPU",
                           "---- 13. 设备名称", "---- 15. Do Not Track",
                           "---- 17. 硬件加速", "---- 19. 启动参数")) {
            if ($fpc -notmatch [regex]::Escape($s)) { throw "section anchor '$s' missing in fp_ui.cpp" }
            Write-Host "section ok: $s"
          }
          # 3. HTTP 服务已删除回归：main.cpp 不得重现监听/路由符号，
          #    /api/*、serveFile、18900、listen 只能出现在说明性注释里。
          $main = Get-Content launcher\cpp\main.cpp -Raw
          $mainCode = (($main -split "`r?`n") | Where-Object { $_ -notmatch '^\s*//' }) -join "`n"
          foreach ($r in @("/api/", "serveFile", "18900", "listen", "closesocket", "accept(")) {
            if ($mainCode -match [regex]::Escape($r)) { throw "removed HTTP symbol '$r' still in main.cpp code" }
            Write-Host "nohttp ok: $r gone"
          }

      - name: Prepare offline-pkg (single-pack source dir)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "offline-pkg"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item launcher\cpp\x64\Release\SunLauncher.exe (Join-Path $out "SunLauncher.exe") -Force
          # PDB 符号随包（本地 dumpbin/windbg 符号化崩溃 offset 用，不影响离线运行）
          $pdbFiles = Get-ChildItem launcher\cpp\x64\Release\*.pdb -ErrorAction SilentlyContinue
          foreach ($p in $pdbFiles) { Copy-Item $p.FullName (Join-Path $out $p.Name) -Force; Write-Host "packed symbol: $($p.Name)" }
          if (Test-Path ports.json) { throw "ports.json must not be packaged" }
          if (Test-Path web-ui) { throw "web-ui/ must not be packaged" }
          @"
          # SunLauncher 离线启动器包（本机使用，不联网、不上传、不与 AdsPower 云端通信）
          # 1. 把 SunLauncher.exe 放到任意目录，双击运行（Win32 原生窗口：profile 列表 + 启动/关闭）
          # 2. 数据目录默认 F:\.ADSPOWER_GLOBAL\cache（指纹配置 A2 行可按指纹改）
          # 3. 浏览器目录默认 ...\cwd_global\chrome_152（指纹配置 A2 行可按指纹改）
          # 4. 指纹配置：点环境再点指纹配置——35+ 参数面板；保存=写回三件套 + ui_fingerprint.json
          # 5. 启动=--extended-parameters 指纹注入；停止=按 user-data-dir 树杀；代理检测=指纹窗内测速按钮
          # 6. 以缓存为准：保护键（UserId/CanvasMark/WebGLMark/ProxyChain/TimeZone 等）在注入与写回时被缓存值覆盖
          # 7. 调试：点启动后无窗口，看 exe 同目录 debug.log（完整命令行 / 3 秒退出码 / [browser] 输出）
          "@ | Out-File (Join-Path $out "README.txt") -Encoding utf8
          # 只准备目录，不在此手动 Compress-Archive：
          # 压缩这件事只做一次，交给 upload-artifact（下载即 zip，解压一次即用）。
          Get-ChildItem $out -Recurse | Format-Table FullName, Length

      - name: Upload artifact (the only compression)
        uses: actions/upload-artifact@v4
        with:
          name: offline-app
          path: offline-pkg/*
          retention-days: 30
          if-no-files-found: error
