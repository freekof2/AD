name: Reverse Engineering Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/static-analysis.yml"

permissions:
  contents: read

env:
  TARGET_URL: "https://github.com/freekof2/AD/releases/download/1.0.0.1/AdsPower.Global.exe"
  TARGET_NAME: "AdsPower.Global.exe"

jobs:
  analyze:
    name: Analyze Windows executable
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 2. Prepare directories
      # ------------------------------------------------------------
      - name: Prepare workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "analysis" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis\downloads" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis\pe" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis\strings" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis\electron" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis\asar" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis\dotnet" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis\resources" | Out-Null
          New-Item -ItemType Directory -Force -Path "analysis\reports" | Out-Null

      # ------------------------------------------------------------
      # 3. Download target EXE
      # ------------------------------------------------------------
      - name: Download target EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "${env:TARGET_URL}"
          $output = "analysis\downloads\${env:TARGET_NAME}"

          Write-Host "Downloading:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $output `
            -UseBasicParsing

          if (!(Test-Path $output)) {
            throw "Download failed."
          }

          $file = Get-Item $output

          Write-Host "File:"
          Write-Host $file.FullName
          Write-Host "Size: $($file.Length) bytes"

      # ------------------------------------------------------------
      # 4. Calculate hashes
      # ------------------------------------------------------------
      - name: Calculate file hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "analysis\downloads\${env:TARGET_NAME}"

          Get-FileHash $file -Algorithm SHA256 |
            Format-List |
            Out-File "analysis\reports\sha256.txt"

          Get-FileHash $file -Algorithm SHA1 |
            Format-List |
            Out-File "analysis\reports\sha1.txt"

          Get-FileHash $file -Algorithm MD5 |
            Format-List |
            Out-File "analysis\reports\md5.txt"

          Write-Host "SHA256:"
          (Get-FileHash $file -Algorithm SHA256).Hash

      # ------------------------------------------------------------
      # 5. PE basic analysis
      # ------------------------------------------------------------
      - name: PE analysis
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = Resolve-Path "analysis\downloads\${env:TARGET_NAME}"

          $bytes = [System.IO.File]::ReadAllBytes($file)

          $report = @()

          $report += "=== PE ANALYSIS ==="
          $report += ""

          $report += "File: $file"
          $report += "Size: $($bytes.Length) bytes"
          $report += ""

          # DOS header
          if ($bytes.Length -ge 64) {
            $mz = [System.Text.Encoding]::ASCII.GetString($bytes, 0, 2)
            $report += "DOS Signature: $mz"

            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)

            $report += "PE Header Offset: 0x{0:X8}" -f $peOffset

            if (
              $peOffset -ge 0 -and
              $peOffset + 4 -le $bytes.Length
            ) {
              $peSig = [System.Text.Encoding]::ASCII.GetString(
                $bytes,
                $peOffset,
                4
              )

              $report += "PE Signature: $peSig"

              if ($peSig -eq "PE`0`0") {
                $machine = [BitConverter]::ToUInt16(
                  $bytes,
                  $peOffset + 4
                )

                $sections = [BitConverter]::ToUInt16(
                  $bytes,
                  $peOffset + 6
                )

                $report += "Machine: 0x{0:X4}" -f $machine
                $report += "Sections: $sections"

                $optionalHeaderSize = [BitConverter]::ToUInt16(
                  $bytes,
                  $peOffset + 20
                )

                $report += "Optional Header Size: $optionalHeaderSize"
              }
            }
          }

          $report | Out-File `
            "analysis\reports\pe-analysis.txt" `
            -Encoding utf8

      # ------------------------------------------------------------
      # 6. Extract ASCII and Unicode strings
      # ------------------------------------------------------------
      - name: Extract strings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "analysis\downloads\${env:TARGET_NAME}"
          $bytes = [System.IO.File]::ReadAllBytes($file)

          # ASCII strings >= 6 characters
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)

          [regex]::Matches(
            $ascii,
            '[ -~]{6,}'
          ) |
          ForEach-Object {
            $_.Value
          } |
          Sort-Object -Unique |
          Out-File `
            "analysis\strings\ascii.txt" `
            -Encoding utf8

          # UTF-16LE strings
          $unicode = [System.Text.Encoding]::Unicode.GetString($bytes)

          [regex]::Matches(
            $unicode,
            '[\u0020-\uFFFF]{4,}'
          ) |
          ForEach-Object {
            $_.Value
          } |
          Sort-Object -Unique |
          Out-File `
            "analysis\strings\unicode.txt" `
            -Encoding utf8

          Write-Host "ASCII strings:"
          (Get-Content "analysis\strings\ascii.txt").Count

          Write-Host "Unicode strings:"
          (Get-Content "analysis\strings\unicode.txt").Count

      # ------------------------------------------------------------
      # 7. Search for Electron / ASAR indicators
      # ------------------------------------------------------------
      - name: Detect Electron
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $asciiFile = "analysis\strings\ascii.txt"
          $unicodeFile = "analysis\strings\unicode.txt"

          $patterns = @(
            "electron",
            "app.asar",
            "resources",
            "node_modules",
            "chrome",
            "Chromium",
            "BrowserWindow",
            "ipcMain",
            "ipcRenderer",
            "electron.exe",
            "node.exe",
            "asar"
          )

          $matches = @()

          foreach ($pattern in $patterns) {

            $asciiMatches = Select-String `
              -Path $asciiFile `
              -Pattern $pattern `
              -SimpleMatch `
              -CaseSensitive:$false `
              -ErrorAction SilentlyContinue

            foreach ($m in $asciiMatches) {
              $matches += "[ASCII] $($m.Line)"
            }

            $unicodeMatches = Select-String `
              -Path $unicodeFile `
              -Pattern $pattern `
              -SimpleMatch `
              -CaseSensitive:$false `
              -ErrorAction SilentlyContinue

            foreach ($m in $unicodeMatches) {
              $matches += "[UNICODE] $($m.Line)"
            }
          }

          $matches |
            Sort-Object -Unique |
            Out-File `
              "analysis\electron\electron-indicators.txt" `
              -Encoding utf8

          if ($matches.Count -gt 0) {
            "ELECTRON_INDICATORS_FOUND=true" >> $env:GITHUB_ENV
            Write-Host "Electron indicators found."
          }
          else {
            "ELECTRON_INDICATORS_FOUND=false" >> $env:GITHUB_ENV
            Write-Host "No obvious Electron indicators found."
          }

      # ------------------------------------------------------------
      # 8. Install 7-Zip
      # ------------------------------------------------------------
      - name: Install 7-Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue

          if ($sevenZip) {
            Write-Host "7-Zip already installed."
            exit 0
          }

          choco install 7zip -y --no-progress

          if (!(Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            throw "7-Zip installation failed."
          }

      # ------------------------------------------------------------
      # 9. Try to extract EXE as an archive
      # ------------------------------------------------------------
      - name: Extract embedded archive data
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $exe = Resolve-Path "analysis\downloads\${env:TARGET_NAME}"
          $out = Resolve-Path "analysis\resources"

          Write-Host "Attempting archive extraction..."

          7z x `
            "$exe" `
            "-o$out" `
            "-y" `
            > "analysis\reports\7zip-extraction.log" 2>&1

          Write-Host "7-Zip extraction completed."

      # ------------------------------------------------------------
      # 10. Search extracted files for ASAR
      # ------------------------------------------------------------
      - name: Locate ASAR files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $asarFiles = Get-ChildItem `
            "analysis\resources" `
            -Recurse `
            -File `
            -Filter "*.asar" `
            -ErrorAction SilentlyContinue

          if ($asarFiles.Count -eq 0) {

            Write-Host "No .asar files found."

            "No ASAR file detected." |
              Out-File `
                "analysis\asar\asar-detection.txt" `
                -Encoding utf8

          }
          else {

            $asarFiles |
              ForEach-Object {
                $_.FullName
              } |
              Out-File `
                "analysis\asar\asar-detection.txt" `
                -Encoding utf8

            "ASAR_FOUND=true" >> $env:GITHUB_ENV

            foreach ($asar in $asarFiles) {
              Write-Host "Found ASAR:"
              Write-Host $asar.FullName
            }
          }

      # ------------------------------------------------------------
      # 11. Install Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # ------------------------------------------------------------
      # 12. Install ASAR tool
      # ------------------------------------------------------------
      - name: Install ASAR extractor
        shell: pwsh
        run: |
          npm install --global @electron/asar

          asar --version

      # ------------------------------------------------------------
      # 13. Extract ASAR archives
      # ------------------------------------------------------------
      - name: Extract ASAR archives
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $asarFiles = Get-ChildItem `
            "analysis\resources" `
            -Recurse `
            -File `
            -Filter "*.asar" `
            -ErrorAction SilentlyContinue

          $index = 0

          foreach ($asar in $asarFiles) {

            $index++

            $name = [System.IO.Path]::GetFileNameWithoutExtension(
              $asar.Name
            )

            $safeName = $name -replace '[^a-zA-Z0-9._-]', '_'

            $destination = Join-Path `
              "analysis\asar" `
              "${index}_${safeName}"

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $destination |
              Out-Null

            Write-Host "Extracting:"
            Write-Host $asar.FullName
            Write-Host "To:"
            Write-Host $destination

            asar extract `
              "$($asar.FullName)" `
              "$destination"
          }

      # ------------------------------------------------------------
      # 14. Search extracted source files
      # ------------------------------------------------------------
      - name: Build source inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = Get-ChildItem `
            "analysis\asar" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          $extensions = @(
            ".js",
            ".mjs",
            ".cjs",
            ".ts",
            ".tsx",
            ".jsx",
            ".json",
            ".html",
            ".htm",
            ".css",
            ".scss",
            ".less",
            ".vue",
            ".map",
            ".wasm",
            ".node"
          )

          $sourceFiles = $files |
            Where-Object {
              $extensions -contains $_.Extension.ToLower()
            }

          $sourceFiles |
            Sort-Object FullName |
            ForEach-Object {
              $_.FullName
            } |
            Out-File `
              "analysis\reports\source-inventory.txt" `
              -Encoding utf8

          $summary = @()

          $summary += "=== SOURCE INVENTORY ==="
          $summary += ""
          $summary += "Total extracted files: $($files.Count)"
          $summary += "Potential source/resource files: $($sourceFiles.Count)"
          $summary += ""

          foreach ($ext in $extensions) {

            $count = @(
              $sourceFiles |
              Where-Object {
                $_.Extension.ToLower() -eq $ext
              }
            ).Count

            if ($count -gt 0) {
              $summary += "$ext : $count"
            }
          }

          $summary |
            Out-File `
              "analysis\reports\source-summary.txt" `
              -Encoding utf8

      # ------------------------------------------------------------
      # 15. Detect source maps
      # ------------------------------------------------------------
      - name: Detect source maps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $maps = Get-ChildItem `
            "analysis\asar" `
            -Recurse `
            -File `
            -Filter "*.map" `
            -ErrorAction SilentlyContinue

          if ($maps.Count -gt 0) {

            $maps |
              ForEach-Object {
                $_.FullName
              } |
              Out-File `
                "analysis\reports\source-maps.txt" `
                -Encoding utf8

            Write-Host "Source maps found: $($maps.Count)"

          }
          else {

            "No source maps found." |
              Out-File `
                "analysis\reports\source-maps.txt" `
                -Encoding utf8

          }

      # ------------------------------------------------------------
      # 16. Detect .NET / CLR
      # ------------------------------------------------------------
      - name: Detect .NET CLR
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Do not infer .NET from strings. Electron applications often contain
          # words such as ".NET" or "Microsoft.NET" in resources and metadata.
          # A managed PE is identified by a non-empty IMAGE_DIRECTORY_ENTRY_COM_DESCRIPTOR
          # (data-directory index 14) in the PE optional header.
          $file = "analysis\downloads\${env:TARGET_NAME}"
          $bytes = [System.IO.File]::ReadAllBytes($file)
          $isDotNet = $false
          $reason = ""

          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            $reason = "Missing DOS MZ signature."
          }
          else {
            $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -lt 0 -or $peOffset + 24 -gt $bytes.Length) {
              $reason = "Invalid PE header offset."
            }
            elseif ([System.Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") {
              $reason = "Missing PE signature."
            }
            else {
              $optionalHeaderSize = [System.BitConverter]::ToUInt16($bytes, $peOffset + 20)
              $optionalOffset = $peOffset + 24
              $optionalEnd = $optionalOffset + $optionalHeaderSize

              if ($optionalEnd -gt $bytes.Length -or $optionalHeaderSize -lt 2) {
                $reason = "Invalid PE optional header."
              }
              else {
                $optionalMagic = [System.BitConverter]::ToUInt16($bytes, $optionalOffset)
                if ($optionalMagic -eq 0x10B) {
                  $numberOfRvaAndSizesOffset = $optionalOffset + 92
                  $dataDirectoryOffset = $optionalOffset + 96
                }
                elseif ($optionalMagic -eq 0x20B) {
                  $numberOfRvaAndSizesOffset = $optionalOffset + 108
                  $dataDirectoryOffset = $optionalOffset + 112
                }
                else {
                  $numberOfRvaAndSizesOffset = -1
                  $dataDirectoryOffset = -1
                  $reason = "Unsupported PE optional-header format."
                }

                $cliDirectoryOffset = $dataDirectoryOffset + (14 * 8)
                if (
                  $dataDirectoryOffset -ge 0 -and
                  $numberOfRvaAndSizesOffset -ge 0 -and
                  $numberOfRvaAndSizesOffset + 4 -le $optionalEnd -and
                  [System.BitConverter]::ToUInt32($bytes, $numberOfRvaAndSizesOffset) -ge 15 -and
                  $cliDirectoryOffset + 8 -le $optionalEnd
                ) {
                  $cliRva = [System.BitConverter]::ToUInt32($bytes, $cliDirectoryOffset)
                  $cliSize = [System.BitConverter]::ToUInt32($bytes, $cliDirectoryOffset + 4)
                  $isDotNet = $cliRva -ne 0 -and $cliSize -ne 0
                  $reason = "CLR directory RVA: 0x{0:X8}; size: {1}." -f $cliRva, $cliSize
                }
                elseif ($dataDirectoryOffset -ge 0) {
                  $reason = "PE optional header does not expose a complete CLR data-directory entry."
                }
              }
            }
          }

          @(
            "=== .NET / CLR DETECTION ==="
            "File: $file"
            "Managed CLR: $isDotNet"
            "Reason: $reason"
          ) | Out-File `
            "analysis\dotnet\dotnet-indicators.txt" `
            -Encoding utf8

          if ($isDotNet) {
            "DOTNET_FOUND=true" >> $env:GITHUB_ENV
            Write-Host ".NET / CLR metadata detected."
          }
          else {
            "DOTNET_FOUND=false" >> $env:GITHUB_ENV
            Write-Host "No CLR metadata detected; skipping ILSpy."
          }

      # ------------------------------------------------------------
      # 17. Install .NET SDK
      # ------------------------------------------------------------
      - name: Setup .NET
        if: env.DOTNET_FOUND == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.x"

      # ------------------------------------------------------------
      # 18. Install ILSpy command line
      # ------------------------------------------------------------
      - name: Install ILSpy
        if: env.DOTNET_FOUND == 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet tool install `
            --global `
            ilspycmd

          $toolPath = Join-Path `
            $env:USERPROFILE `
            ".dotnet\tools"

          $toolPath >> $env:GITHUB_PATH

          ilspycmd --help

      # ------------------------------------------------------------
      # 19. Decompile .NET executable
      # ------------------------------------------------------------
      - name: Decompile .NET executable
        if: env.DOTNET_FOUND == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Resolve-Path `
            "analysis\downloads\${env:TARGET_NAME}"

          $output = Resolve-Path `
            "analysis\dotnet"

          $log = "analysis\reports\ilspy.log"
          Write-Host "Attempting .NET decompilation..."

          & ilspycmd `
            -p `
            -o "$output" `
            "$exe" `
            *> $log
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            Add-Content -Path $log -Value "ILSpy exited with code $exitCode."
            Write-Warning "ILSpy could not decompile the detected managed PE; see $log."
          }
          else {
            Write-Host "ILSpy decompilation completed."
          }

          # Decompilation is optional analysis. Preserve the report and do not
          # turn a tool limitation into a failed workflow annotation.
          exit 0

      # ------------------------------------------------------------
      # 20. Search for JavaScript source maps and source content
      # ------------------------------------------------------------
      - name: Analyze JavaScript source
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $jsFiles = Get-ChildItem `
            "analysis\asar" `
            -Recurse `
            -File `
            -Include *.js,*.mjs,*.cjs `
            -ErrorAction SilentlyContinue

          $report = @()

          $report += "=== JAVASCRIPT ANALYSIS ==="
          $report += ""
          $report += "JavaScript files: $($jsFiles.Count)"
          $report += ""

          foreach ($file in $jsFiles) {

            $size = $file.Length

            $report += "$($file.FullName) | $size bytes"
          }

          $report |
            Out-File `
              "analysis\reports\javascript-analysis.txt" `
              -Encoding utf8

      # ------------------------------------------------------------
      # 21. Generate final report
      # ------------------------------------------------------------
      - name: Generate final report
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $report = @()

          $report += "========================================"
          $report += "AdsPower Global Static Analysis Report"
          $report += "========================================"
          $report += ""

          $report += "Target:"
          $report += "${env:TARGET_NAME}"
          $report += ""

          $report += "URL:"
          $report += "${env:TARGET_URL}"
          $report += ""

          $report += "Electron indicators:"
          $report += "${env:ELECTRON_INDICATORS_FOUND}"
          $report += ""

          $report += "ASAR detected:"
          $report += "${env:ASAR_FOUND}"
          $report += ""

          $report += ".NET detected:"
          $report += "${env:DOTNET_FOUND}"
          $report += ""

          $report += "Analysis directories:"
          $report += "- downloads"
          $report += "- pe"
          $report += "- strings"
          $report += "- electron"
          $report += "- resources"
          $report += "- asar"
          $report += "- dotnet"
          $report += "- reports"
          $report += ""

          $report += "Important:"
          $report += "This is static extraction/decompilation."
          $report += "It does not reconstruct the original developer project."
          $report += "Obfuscated/minified code may remain obfuscated/minified."

          $report |
            Out-File `
              "analysis\reports\FINAL-REPORT.txt" `
              -Encoding utf8

          Get-Content `
            "analysis\reports\FINAL-REPORT.txt"

      # ------------------------------------------------------------
      # 22. Compress analysis result
      # ------------------------------------------------------------
      - name: Create analysis archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "analysis-result.zip") {
            Remove-Item "analysis-result.zip" -Force
          }

          Compress-Archive `
            -Path "analysis\*" `
            -DestinationPath "analysis-result.zip" `
            -CompressionLevel Optimal

          Write-Host "Archive created:"
          Get-Item "analysis-result.zip" |
            Select-Object FullName, Length

      # ------------------------------------------------------------
      # 23. Upload all analysis files
      # ------------------------------------------------------------
      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdsPower-static-analysis
          path: |
            analysis/
            analysis-result.zip
          retention-days: 30
          if-no-files-found: warn
