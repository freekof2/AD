name: Build Offline App

# 离线应用构建：SunLauncher(C++ 指纹注入版) + web-ui(离线版) 打包。
# 零外部网络下载（除 Actions 官方 action 与 MSVC 工具链外）；不碰 AdsPower 云端。
# 产物：offline-app.zip（含 SunLauncher.exe + web-ui/ + ports.json 模板 + README）。
# 本地不测试：直接 push，由本工作流在 windows-latest 上编译 + 校验。

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - "web-ui/**"
      - ".github/workflows/build-offline.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build SunLauncher + package web-ui (offline)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SunLauncher (C++ Win32, fingerprint edition)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild launcher\cpp\SunLauncher.vcxproj /p:Configuration=Release /p:Platform=x64
          $exe = Get-ChildItem launcher\cpp\x64\Release\SunLauncher.exe -ErrorAction Stop
          Write-Host "built: $($exe.FullName) ($($exe.Length) bytes)"

      - name: Check web-ui required files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @("web-ui/index.html", "web-ui/css/app.css", "web-ui/js/fp.js",
                     "web-ui/js/api.js", "web-ui/js/mock.js", "web-ui/js/app.js", "web-ui/README.md")
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "missing: $f" }
            Write-Host "ok: $f ($((Get-Item $f).Length) bytes)"
          }

      - name: JS syntax check (node --check)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --version
          foreach ($f in @("web-ui/js/fp.js", "web-ui/js/api.js", "web-ui/js/mock.js", "web-ui/js/app.js")) {
            node --check $f
            Write-Host "syntax ok: $f"
          }

      - name: Offline contract check (no cloud / since-mock cleanup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 1. web-ui 不得再引用云端域名 / token / 旧云端路由
          $banned = @("adspower.net", "adspower.com", "loginkits.com", "xmp.one",
                      "login-token", "apiKey", "/api/v1/", "/api/v2/",
                      "ENV-", "activeProfile", "page-profiles", "page-groups")
          foreach ($f in @("web-ui/index.html", "web-ui/js/api.js", "web-ui/js/mock.js", "web-ui/js/app.js", "web-ui/js/fp.js")) {
            $t = Get-Content $f -Raw
            foreach ($b in $banned) {
              if ($t -match [regex]::Escape($b)) { throw "banned string '$b' in $f" }
            }
            Write-Host "clean: $f"
          }
          # 2. C++ 指纹模块必备符号
          $cpp = Get-Content launcher\cpp\fingerprint.cpp -Raw
          foreach ($s in @("FpEncode", "FpDecode", "FpMd5Hex", "FpBuildCmdline", "FpKillProfileTree",
                           "hTy1bfRJz4nLPcBCO7WtmNIaGvVeul5Zo8kq32UxrYw_-0gsjp96SDFXQiEMKdHA",
                           "ui_fingerprint.json")) {
            if ($cpp -notmatch [regex]::Escape($s)) { throw "missing symbol '$s' in fingerprint.cpp" }
            Write-Host "symbol ok: $s"
          }
          # 3. HTTP 离线路由齐备
          $main = Get-Content launcher\cpp\main.cpp -Raw
          foreach ($r in @("/api/profiles", "/api/start", "/api/stop", "/api/fp/", "/api/fp/save")) {
            if ($main -notmatch [regex]::Escape($r)) { throw "missing route '$r' in main.cpp" }
            Write-Host "route ok: $r"
          }
          # 4. web-ui 脚本引用顺序（fp.js 必须在 api.js 之前）
          $html = Get-Content web-ui/index.html -Raw
          $iFp = $html.IndexOf("js/fp.js"); $iApi = $html.IndexOf("js/api.js")
          if ($iFp -lt 0 -or $iApi -lt 0 -or $iFp -gt $iApi) { throw "fp.js must load before api.js" }
          Write-Host "script order ok"

      - name: Package offline-app.zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "offline-pkg"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item launcher\cpp\x64\Release\SunLauncher.exe (Join-Path $out "SunLauncher.exe") -Force
          Copy-Item web-ui (Join-Path $out "web-ui") -Recurse -Force
          Copy-Item ports.json (Join-Path $out "ports.json") -Force
          @"
          # 离线启动器包（本机使用，不联网）
          # 1. 把 SunLauncher.exe 放到任意目录，双击运行
          # 2. 数据目录默认 F:\.ADSPOWER_GLOBAL\cache（窗口里可改）
          # 3. 浏览器目录默认 ...\cwd_global\chrome_152（窗口里可改，cmd.Dir 必须设在含版本子目录那一级）
          # 4. UI：在窗口启动后访问 http://127.0.0.1:18900/（SunLauncher 内置 serving web-ui/）
          #    也可 file:// 双击 web-ui/index.html（演示模式，仅目录导入可用）
          # 5. 绝不连接 AdsPower 云端：无 token、无 login-token、无上报；CLIENT_HOST 一律剥离
          "@ | Out-File (Join-Path $out "README.txt") -Encoding utf8
          if (Test-Path offline-app.zip) { Remove-Item offline-app.zip -Force }
          Compress-Archive -Path "$out\*" -DestinationPath offline-app.zip -Force
          Get-Item offline-app.zip | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-app
          path: offline-app.zip
          retention-days: 30
          if-no-files-found: error
