name: Build SunLauncher

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build SunLauncher.exe (MSVC x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (C++ Win32, no third-party deps)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild launcher\cpp\SunLauncher.vcxproj /p:Configuration=Release /p:Platform=x64
          $exe = Get-ChildItem launcher\cpp\x64\Release\SunLauncher.exe -ErrorAction Stop
          Copy-Item $exe.FullName launcher\SunLauncher.exe -Force
          Get-Item launcher\SunLauncher.exe | Format-Table Name,Length

      - name: Smoke test (window process starts, no SunBrowser needed)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # 只验证 exe 可加载、debug.log 能生成；不启动 SunBrowser。
          $tmp = Join-Path $env:RUNNER_TEMP "sunlaunch-smoke"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item launcher\SunLauncher.exe (Join-Path $tmp "SunLauncher.exe") -Force
          $p = Start-Process -FilePath (Join-Path $tmp "SunLauncher.exe") -WorkingDirectory $tmp -PassThru
          Start-Sleep -Seconds 5
          try {
            $log = Join-Path $tmp "debug.log"
            if (Test-Path $log) {
              Write-Host "debug.log exists, tail:"
              Get-Content $log -Tail 10
            } else {
              Write-Host "debug.log NOT found"
            }
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:18900/api/profiles" -UseBasicParsing -TimeoutSec 10
            Write-Host "HTTP $($r.StatusCode): $($r.Content.Substring(0, [Math]::Min(200, $r.Content.Length)))"
          } catch {
            Write-Host "smoke: $($_.Exception.Message)"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SunLauncher-windows-amd64
          path: launcher/SunLauncher.exe
          retention-days: 30
          if-no-files-found: error
